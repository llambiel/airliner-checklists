# Server block for the checklist page. Copied to /etc/nginx/conf.d/default.conf.
server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # The site is a single ~105 KB document — worth compressing, not worth caching
    # aggressively, since a rebuild replaces the whole file.
    gzip              on;
    gzip_types        text/css application/javascript;  # text/html is always gzipped
    gzip_min_length   1024;
    add_header        Cache-Control "no-cache";
    add_header        X-Content-Type-Options "nosniff";

    # One host per page, whatever the domain: www.example.com/x → example.com/x.
    # Two hosts serving the same bytes splits a page's search ranking in half.
    if ($host ~* ^www\.(?<naked>.+)$) {
        return 301 https://$naked$request_uri;
    }

    # $uri.html lets /types/a320ceo work as well as /types/a320ceo.html. The
    # canonical tag in each page names the .html form, so only one is indexed.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Health probe that doesn't drag the whole page over the wire.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
