# 707 — Boeing 707-120 / -320 / -320B / -320C
id:   b707
code: "707"   # tab label
name: Boeing 707
sub:  4 × JT3D turbofan · three-crew with a flight engineer · EPR thrust
manufacturer: Boeing
variants:
  - name: "-120"
    note: The first production build, short body. JT3C turbojets on the earliest airframes.
  - name: "-320B"
    note: The intercontinental one with the extended wing and JT3D fans. The definitive 707.
  - name: "-320C"
    note: Convertible passenger and freight, with a main deck cargo door.
  - name: E-3 / KC-135 family
    note: Military relatives on the same airframe. Related, but their systems and these items diverge quickly.

phases:

  - id:   power
    name: Power Up
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - BATTERY: "ON"
      - EXT PWR / GROUND CART: CONNECTED
      - EMERGENCY LIGHTS: ARM
      - INVERTERS: "ON"
      - COMPASS / GYROS: SET & SLAVED
      - PARKING BRAKE: SET

  - id:   fepanel
    name: Flight Engineer Panel
    kind: flow
    items:
      - ELECTRICAL: GENERATORS OFF — BUS TIES SET
      - FUEL PANEL: TANKS 1 / 2 / 3 / 4 + RESERVES — PUMPS ON
        note: Four mains, two reserves and a centre tank on most builds, all balanced by hand. The engineer flies the fuel while the pilots fly the aeroplane.
      - HYDRAULICS: UTILITY & BOOST CHECKED
      - PNEUMATICS: BLEEDS SET
      - PRESSURIZATION: FLT & LAND ALT SET
      - AIR CONDITIONING: PACKS AS REQUIRED
      - ANTI-ICE: "OFF"
      - EPR / TAKEOFF DATA: COMPUTED — BUGS SET
        note: Thrust is set on EPR, worked out from the charts by the engineer. There is no computer to check the arithmetic.

  - id:   preflight
    name: Preflight
    kind: checklist
    items:
      - GEAR PINS: REMOVED
      - OXYGEN: TESTED — CREW & PASSENGER
      - FLIGHT INSTRUMENTS: SET & CROSSCHECKED
      - ALTIMETERS: ____ SET
      - RADIOS & NAVAIDS: SET
      - STAB TRIM: ____ UNITS
      - TAKEOFF BRIEFING: COMPLETE

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - DOORS: CLOSED
      - FUEL: ____ KG — PUMPS ON
      - PNEUMATIC PRESSURE: CHECKED
      - HYDRAULICS: CHECKED
      - ANTI COLLISION LIGHT: "ON"
      - PARKING BRAKE: SET
      - START CLEARANCE: OBTAINED
      - MAIN DECK CARGO DOOR: CLOSED AND LOCKED
        only:
          - "-320C"
      - LOAD & RESTRAINT: SECURED — LOADSHEET CHECKED
        only:
          - "-320C"
        note: A freighter's CG range is wider than the passenger version's and the load is not self-loading. Check the trim setting against the load sheet, not against habit.

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - IGNITION: "ON"
      - ENGINE 3 START: ENGAGED
        note: Number 3 first is common, since it drives the hydraulics most operators want running early. Sequences vary — follow your add-on's checklist.
      - START LEVER 3: IDLE AT 20% N2
      - ENGINE 4: START
      - ENGINE 2: START
      - ENGINE 1: START
      - GENERATORS: ON — PARALLELED
      - PACKS: "ON"

  - id:   astart
    name: After Start
    kind: checklist
    items:
      - GENERATORS: ON — LOADS BALANCED
      - HYDRAULICS: PUMPS ON
      - PACKS: "ON"
      - FLAPS: ____ SET — LEADING EDGE OUT
      - FLIGHT CONTROLS: CHECKED
      - GROUND EQUIPMENT: CLEAR

  - id:   taxi
    name: Taxi
    kind: checklist
    items:
      - BRAKES: CHECKED
      - FLIGHT INSTRUMENTS: NO FLAGS
      - GYROS: SET & CROSSCHECKED
      - YAW DAMPER: "ON"
      - TAXI CLEARANCE: ____ CONFIRMED

  - id:   btakeoff
    name: Before Takeoff
    kind: checklist
    items:
      - FLAPS: ____ — INDICATED
      - STAB TRIM: ____ UNITS
      - EPR BUGS: SET
      - ANNUNCIATORS: CHECKED
      - CABIN: SECURE
      - divider: Line-up items
      - IGNITION: CONTINUOUS
      - EXTERIOR LIGHTS: LANDING · ON
      - TAKEOFF CLEARANCE: RECEIVED
      - MAIN DECK FIRE SUPPRESSION: ARMED
        only:
          - "-320C"
      - SUPERNUMERARIES: BRIEFED
        only:
          - "-320C"

  - id:   atakeoff
    name: After Takeoff
    kind: checklist
    items:
      - LANDING GEAR: UP
      - FLAPS: UP — LEADING EDGE IN
      - IGNITION: "OFF"
      - PRESSURIZATION: CHECKED
      - ALTIMETERS: STD AT TRANS ALT

  - id:   cruise
    name: Cruise
    kind: flow
    items:
      - FUEL: BALANCED — TANK TO ENGINE
      - CRUISE EPR: SET
      - PRESSURIZATION: CHECKED
      - SYSTEMS: ENGINEER MONITORING
      - POSITION: PLOTTED & CROSSCHECKED
      - DESCENT PREP: ARRIVAL · APPROACH · MINIMUMS BRIEFED

  - id:   descent
    name: Descent
    kind: checklist
    items:
      - PRESSURIZATION: LAND ALT ____
      - ALTIMETERS: ____ SET
      - APPROACH BRIEFING: COMPLETE
      - VREF / MINIMUMS: ____ SET
      - IGNITION: AS REQUIRED
      - SEAT BELTS: "ON"

  - id:   land
    name: Before Landing
    kind: checklist
    items:
      - LANDING GEAR: DOWN — 3 GREEN
      - FLAPS: ____ — INDICATED
      - SPOILERS: ARMED
      - ANTI-SKID: "ON"
      - ANNUNCIATORS: CHECKED

  - id:   aland
    name: After Landing
    kind: checklist
    items:
      - SPOILERS: RETRACTED
      - FLAPS: UP
      - IGNITION: "OFF"
      - ANTI-ICE: AS REQUIRED
      - TRANSPONDER: STBY

  - id:   shutdown
    name: Shutdown
    kind: checklist
    items:
      - PARKING BRAKE: SET
      - START LEVERS: CUTOFF
      - FUEL PUMPS: "OFF"
      - HYDRAULIC PUMPS: "OFF"
      - GENERATORS: "OFF"
      - SEAT BELTS: "OFF"

  - id:   secure
    name: Secure
    kind: checklist
    items:
      - INVERTERS: "OFF"
      - EMERGENCY LIGHTS: "OFF"
      - PACKS: "OFF"
      - EXT PWR: DISCONNECTED
      - BATTERY: "OFF"
