# Airbus A321-200
id:   a321
code: A321   # tab label
name: Airbus A321-200
sub:  2 × CFM56-5B / V2500-A5 · longest of the ceo family · CONF 3 landings common
manufacturer: Airbus
variants:
  - name: -100
    note: The original, without the centre tank. Short range and rarely seen now.
  - name: -200
    note: The common one — higher weights and an auxiliary centre tank.
  - name: -200 with ACTs
    note: Extra centre tanks in the hold for the longer sectors. Watch the CG as they feed.

phases:

  - id:   prelim
    name: Preliminary Cockpit Prep
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - ENG MASTER 1 + 2: "OFF"
      - ENG MODE SEL: NORM
      - WEATHER RADAR: "OFF"
      - LDG GEAR LEVER: DOWN
      - WIPERS: "OFF"
      - BAT 1 + 2: CHECK > 25.5 V — AUTO
      - EXT PWR: AS RQRD
      - APU FIRE: TEST
      - APU: START
      - APU BLEED: "ON"
      - ADIRS 1 / 2 / 3: NAV
        note: Align takes ~7 min (up to 10 at high latitude). Do it early — aircraft must stay still.
      - COCKPIT LIGHTS: AS RQRD
      - ACCU PRESS: CHECK
      - PARKING BRAKE: "ON"
      - BRAKE PRESS: CHECK
      - FLAPS: CHECK POSITION
      - SPEED BRAKE LEVER: RET & DISARMED
      - GEAR PINS & COVERS: ON BOARD

  - id:   prep
    name: Cockpit Preparation
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - divider: Overhead panel
      - RCDR GND CTL: "ON"
      - EVAC SWITCH: CAPT & PURS
      - EXT LT: NAV & LOGO ON · STROBE AUTO
      - SIGNS: SEAT BELTS ON · NO SMOKING AUTO
      - EMER EXIT LT: ARM
      - ANTI ICE: AS RQRD
      - LDG ELEV: AUTO
      - PACK FLOW / X BLEED: AS RQRD / AUTO
      - FUEL PUMPS: "ON"
      - OXY CREW SUPPLY: "ON"
      - divider: Panels and pedestal
      - BARO REF: SET
      - FD / LS: ON / AS RQRD
      - WEATHER RADAR / PWS: OFF / AUTO
      - ATC: CODE SET — STBY
      - divider: FMGS
      - MCDU: INIT A · F-PLN · RAD NAV · INIT B · PERF
        note: ZFW / ZFWCG and block fuel from your loadsheet, then take-off perf.
      - TAKEOFF DATA: V1 / VR / V2 / FLEX INSERTED
        note: FLEX temp must be above the current TAT/OAT or the FADEC ignores it and gives you CLB thrust.
      - FCU: SPD / HDG / ALT SET
      - OXYGEN MASK: TEST
      - TAKEOFF BRIEFING: COMPLETED

  - id:   bstart
    name: Before Start
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - COCKPIT PREP: COMPLETED (BOTH)
      - GEAR PINS & COVERS: REMOVED
      - SIGNS: ON / AUTO
      - ADIRS: NAV
      - FUEL QUANTITY: ____ KG
      - TO DATA: SET
      - BARO REF: ____ SET (BOTH)
      - divider: Below the line
      - WINDOWS / DOORS: CLOSED (BOTH)
      - BEACON: "ON"
      - THR LEVERS: IDLE
      - PARKING BRAKE: AS RQRD

  - id:   start
    name: Engine Start
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - ENG MODE SEL: IGN / START
      - ENG MASTER 2: "ON"
        note: "CFM56-5B: start valve opens and N2 rises, igniter at 16% N2, fuel flow at 22% N2, EGT rise within 15 s. Stable idle ≈ 19% N1 / 59% N2."
      - ENG MASTER 1: "ON"
        note: Starter duty cycle — if a start is aborted, give the starter its cooling period before trying again.
      - divider: After engine start
      - ENG MODE SEL: NORM
      - APU BLEED: "OFF"
      - ENG ANTI ICE: AS RQRD
      - APU MASTER SW: AS RQRD
      - GROUND SPOILERS: ARM
      - RUDDER TRIM: ZERO
      - FLAPS: SET
      - PITCH TRIM: SET
      - ECAM STATUS: CHECK

  - id:   astart
    name: After Start
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - ANTI ICE: AS RQRD
      - ECAM STATUS: CHECKED
      - PITCH TRIM: ____ SET
      - RUDDER TRIM: ZERO

  - id:   taxi
    name: Before Takeoff
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - FLIGHT CONTROLS: CHECKED (BOTH)
      - FLT INST: CHECKED (BOTH)
      - BRIEFING: CONFIRMED
      - FLAP SETTING: CONF ____ (BOTH)
        note: Longest of the ceo family, so the tail is a long way behind you. Rotate at about 3°/s and stop at 15° of pitch until you are airborne.
      - V1, VR, V2 / FLX TEMP: ____ (BOTH)
      - ATC: SET
      - ECAM MEMO: TO NO BLUE
      - AUTO BRK: MAX
        sub: true
      - SIGNS: "ON"
        sub: true
      - CABIN: CHECK
        sub: true
      - SPLRS: ARM
        sub: true
      - FLAPS: T.O
        sub: true
      - T.O CONFIG: NORMAL
        sub: true
      - divider: Below the line
      - TAKEOFF RWY: ____ (BOTH)
      - CABIN CREW: ADVISED
      - TCAS: TA OR TA/RA
      - ENG MODE SEL: AS RQRD
      - PACKS: AS RQRD
        note: "Packs off buys thrust for a hot / high / short runway — recompute your take-off performance for the configuration you actually use. Line-up flow, not on the card: exterior lights T.O, strobe ON, brake fans off, chrono start."

  - id:   climb
    name: After Takeoff / Climb
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - LDG GEAR: UP
      - FLAPS: RETRACTED
      - PACKS: "ON"
      - divider: Below the line
      - BARO REF: ____ SET (BOTH)
        note: Read at the transition altitude.

  - id:   cruise
    name: Cruise
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - FUEL: CHECKED vs FLIGHT PLAN
      - POSITION / NAV ACCURACY: CROSSCHECKED
      - CRUISE LEVEL / STEP CLIMB: AS PLANNED
      - WEATHER RADAR: AS RQRD
      - DESCENT PREP: ARRIVAL · APPR · MINIMA IN MCDU

  - id:   appr
    name: Approach
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - BRIEFING: CONFIRMED
      - ECAM STATUS: CHECKED
      - SEAT BELTS: "ON"
      - BARO REF: ____ SET (BOTH)
      - MINIMUM: ____ SET (BOTH)
      - ENG MODE SEL: AS RQRD

  - id:   land
    name: Landing
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - CABIN CREW: ADVISED
      - A/THR: SPEED / OFF
      - AUTO BRAKE: AS RQRD
      - ECAM MEMO: LDG NO BLUE
      - LDG GEAR: DN
        sub: true
      - SIGNS: "ON"
        sub: true
      - CABIN: CHECK
        sub: true
      - SPLRS: ARM
        sub: true
      - FLAPS: SET
        sub: true
        note: CONF 3 is the common choice on the A321 — it keeps the pitch attitude lower in the flare and the tail further from the runway.

  - id:   aland
    name: After Landing
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - FLAPS: RETRACTED
      - SPOILERS: DISARMED
      - APU: START
      - RADAR: OFF / STBY
      - PWS: "OFF"

  - id:   park
    name: Parking
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - APU BLEED: "ON"
      - ENGINES: "OFF"
        note: Give the CFM56 a ~3 min cool-down at idle before shutdown after a normal landing.
      - SEAT BELTS: "OFF"
      - EXT LT: AS RQRD
      - FUEL PUMPS: "OFF"
      - PARK BRK & CHOCKS: AS RQRD

  - id:   secure
    name: Securing the Aircraft
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - ADIRS: "OFF"
      - OXYGEN: "OFF"
      - APU BLEED: "OFF"
      - EMER EXIT LT: "OFF"
      - SIGNS: "OFF"
      - APU AND BAT: "OFF"
