# Bombardier Challenger 600 series
id:   cl60
code: CL-60   # tab label
name: Bombardier Challenger 604 / 605 / 650
sub:  2 × CF34-3B · two-crew · wide cabin, transatlantic legs
manufacturer: Bombardier
variants:
  - name: "604"
    note: Collins Pro Line 4 with tube-fed EFIS. The one most operators started on.
  - name: "605"
    note: Pro Line 21 with four big displays and larger cabin windows. Same airframe and engines underneath.
  - name: "650"
    note: Pro Line 21 Advanced and a little more thrust from the CF34-3B MTO rating. Flies the same, climbs slightly better out of hot fields.

phases:

  - id:   power
    name: Power Up
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - BATTERY MASTER: "ON"
      - EXT PWR / APU: AS REQUIRED
      - APU FIRE TEST: PERFORMED
      - APU: START — AVAIL
      - AVIONICS MASTER: "ON"
      - EMERGENCY LIGHTS: ARM
      - PARKING BRAKE: SET

  - id:   scan
    name: Preflight Scan
    kind: flow
    items:
      - THRUST LEVERS: SHUT OFF
      - GEAR HANDLE: DOWN
      - FLAPS: AGREE WITH SURFACES
      - SPOILERS: RETRACTED
      - FUEL PUMPS / XFLOW: SET
      - HYDRAULICS 1 / 2 / 3: CHECKED
      - PRESSURISATION: AUTO — LANDING ELEV SET
      - ANTI-ICE: AS REQUIRED
      - FMS: FLIGHT PLAN · PERF LOADED
      - TAKEOFF DATA: V1 / VR / V2 · N1 SET
      - TRIM: TAKEOFF — GREEN BAND
      - TAKEOFF BRIEFING: COMPLETED

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - DOOR: CLOSED — LOCKED
      - PASSENGER BRIEF: COMPLETE
      - FUEL: ____ LB — BALANCED
        note: Tanks feed by gravity and transfer between the wings and the tail. Watch the imbalance rather than assuming the system will sort it out.
      - WEIGHT & CG: WITHIN LIMITS
      - FLIGHT INSTRUMENTS: SET & CROSSCHECKED
      - ALTIMETERS: ____ SET
      - IGNITION: NORM
      - BEACON: "ON"
      - PARKING BRAKE: SET

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - AREA: CLEAR
      - APU BLEED: "ON"
      - ENGINE 2 STARTER: ENGAGED — N2 RISING
      - THRUST LEVER 2: IDLE AT 20% N2
        note: The CF34 wants light-up within about ten seconds of fuel. Hand on the lever until ITT peaks and starts back down.
      - ITT: MONITORED — WITHIN LIMITS
      - STARTER: DISENGAGED — GENERATOR ON
      - ENGINE 1: STARTED — STABILISED
      - APU BLEED: AS REQUIRED
      - EXTERNAL POWER: DISCONNECTED

  - id:   astart
    name: After Start
    kind: checklist
    items:
      - GENERATORS: ON — LOAD SHARED
      - HYDRAULIC PUMPS: SET
      - FLIGHT CONTROLS: FREE AND CORRECT
      - FLAPS: "20"
      - TRIM: PITCH · ROLL · YAW SET
      - ANTI-ICE: AS REQUIRED
      - CABIN: SECURE

  - id:   taxi
    name: Taxi / Before Takeoff
    kind: checklist
    items:
      - BRAKES: CHECKED
      - FLIGHT INSTRUMENTS: CROSSCHECKED
      - FLAPS: 20 — CONFIRMED
      - SPOILERS: RETRACTED — ARMED AS REQUIRED
      - IGNITION: AS REQUIRED
      - TRANSPONDER: TA / RA
      - EXTERIOR LIGHTS: STROBE · LANDING · RECOG
      - divider: Line-up items
      - RUNWAY: ____ CONFIRMED
      - TAKEOFF N1: SET
        note: The wing is a clean, fast one with modest low-speed manners. Rotate at VR and fly the attitude — dragging it off early does nothing good.

  - id:   climb
    name: After Takeoff / Climb
    kind: checklist
    items:
      - LANDING GEAR: UP
      - FLAPS: UP
      - YAW DAMPER: "ON"
      - CLIMB N1: SET
      - PRESSURISATION: CLIMBING NORMALLY
      - ANTI-ICE: AS REQUIRED
      - ALTIMETERS: STD SET AT TRANSITION

  - id:   cruise
    name: Cruise
    kind: flow
    items:
      - CRUISE N1 / MACH: SET
      - FUEL: BALANCED — CHECKED vs PLAN
      - CABIN ALTITUDE: CHECKED
      - ENGINE INSTRUMENTS: NORMAL
      - OCEANIC CLEARANCE: AS REQUIRED
      - DESCENT PREP: ARRIVAL · APPROACH · MINIMA

  - id:   desc
    name: Descent
    kind: checklist
    items:
      - PRESSURISATION / LANDING ELEV: SET
      - ALTIMETERS: ____ SET
      - ANTI-ICE: AS REQUIRED
      - SPOILERS: AS REQUIRED
      - APPROACH BRIEFING: COMPLETE
      - SEAT BELTS: "ON"

  - id:   appr
    name: Approach (ILS)
    kind: flow
    items:
      - divider: Approaching the fix
      - AIRSPEED: FLAPS 0° SPEED + 30 KIAS
      - divider: Fix outbound, or 12 nm out straight-in
      - FLAPS: 20°
      - AIRSPEED: FLAPS 20° SPEED + 20 KIAS
      - divider: Cleared for the approach, established inbound
      - FCP MODE: APPR
      - MODE ANNUNCIATIONS: VERIFY
        note: LOC and GS armed in white on both PFDs, then LOC green on both.
      - divider: One dot below the glideslope
      - LDG GEAR LEVER: DN
      - FLAPS: 30°
      - divider: Glideslope capture
      - FLAPS: 45°
      - AIRSPEED: VREF + 10 KIAS
      - BEFORE LANDING CHECK: COMPLETE
      - PRESELECT ALT: SET TO MISSED APPROACH ALTITUDE
      - divider: 1,500 ft AGL
      - AIRSPEED: VREF + WIND
        note: Half the steady crosswind plus all the gust, whatever the direction. Maximum +20 KIAS.
      - divider: Final approach fix
      - FIX NAME, ALTITUDE AND FLAGS: RECHECK
      - divider: DH / DA, landing feasible
      - AUTOPILOT (IF USED): DISCONNECT — NOT BELOW 80 FT AGL

  - id:   land
    name: Before Landing Check
    kind: checklist
    items:
      - IGNITION, CONT SWITCH / LIGHT: AS REQUIRED
      - ANTI-ICE, WING SWITCH: SELECT AS REQUIRED
      - ANTI-ICE, COWL L AND R SWITCH / LIGHTS: SELECT AS REQUIRED
        note: Wing and cowl anti-ice must be on in icing conditions — TAT 10 °C or below with visible moisture. If the WING HEAT lights or the A/ICE ON advisory go out, increase thrust until they come back; if they stay out, leave the icing.
      - CABIN: ADVISE — 5 MIN BEFORE LANDING
      - PASS SIGNS, NO SMKG SWITCH: "ON"
      - PASS SIGNS, SEAT BLTS SWITCH: "ON"
      - LDG GEAR LEVER: DN — THREE GREEN
      - BRAKE AND ANTI-SKID SYSTEM: CHECK
        note: Wait 5 s after the gear is down before the test, or you get nuisance A/SKID cautions.
      - ANTI SKID, ARMED SWITCH: CHECK ARMED
        sub: true
      - ANTI SKID, TEST SWITCH: TEST — A/SKID IN TEST ON, THEN OUT
        sub: true
      - NOSE STEER SWITCH: CHECK ARMED
        sub: true
      - THRUST REVERSER, L AND R SWITCHES: ARMED
        note: L and R REV ARMED on, REV UNSAFE and REV UNLOCKED out. Do not arm with REV UNSAFE displayed.
      - FLAPS: AS REQUIRED — INDICATION CHECKED
        note: Carry the speed the numbers give you and no more. Float in a Challenger uses runway quickly and the brakes get warm.
      - divider: At 100 ft AGL
      - ATS MSD: CHECK — SPEED FLASHES

  - id:   aland
    name: After Landing
    kind: checklist
    items:
      - THRUST REVERSERS: STOWED
      - FLAPS: UP
      - SPOILERS: RETRACTED
      - ANTI-ICE: AS REQUIRED
      - APU: AS REQUIRED
      - TRANSPONDER: STBY
      - EXTERIOR LIGHTS: SET

  - id:   shut
    name: Shutdown
    kind: checklist
    items:
      - PARKING BRAKE: SET
      - APU: RUNNING — BLEED ON
      - ENGINES: IDLE COOL-DOWN COMPLETE
      - THRUST LEVERS: SHUT OFF
      - FUEL PUMPS: "OFF"
      - SEAT BELTS: "OFF"

  - id:   secure
    name: Securing the Aircraft
    kind: checklist
    items:
      - APU: "OFF"
      - EMERGENCY LIGHTS: "OFF"
      - AVIONICS MASTER: "OFF"
      - BATTERY MASTER: "OFF"
      - DOOR / CHOCKS: AS REQUIRED
