# 747-8 — Boeing 747-8I / 747-8F
id:   b7478
code: 747-8   # tab label
name: Boeing 747-8
sub:  4 × GEnx-2B67 · two-crew · new wing, 787-generation systems
manufacturer: Boeing
variants:
  - name: 747-8I
    note: Intercontinental — the passenger version, 5.6 m longer than the -400.
  - name: 747-8F
    note: Freighter with the nose door. Sim add-ons usually model the -8I.

phases:

  - id:   power
    name: Power Up
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - BATTERY: "ON"
      - STANDBY POWER: AUTO
      - EXT PWR / APU: "ON"
      - EMERGENCY LIGHTS: ARMED
      - IRS: NAV
      - CDU: POS INIT · ROUTE · PERF INIT
      - PARKING BRAKE: SET

  - id:   scan
    name: Preflight Scan
    kind: flow
    items:
      - OXYGEN: TESTED — 100%
      - WINDOW HEAT: "ON"
      - PROBE HEAT: AUTO
      - HYDRAULICS 1–4: DEMAND PUMPS AUTO
      - PACKS: AUTO
      - BLEEDS 1–4: "ON"
      - PRESSURIZATION: LAND ALT SET
      - FUEL: PUMPS ON — CENTER FIRST
      - FUEL CONTROL SWITCHES 1–4: CUTOFF
      - SPEEDBRAKE: DOWN DETENT
      - FLAPS: UP
      - TAKEOFF DATA: THRUST · V-SPEEDS · STAB TRIM SET

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - FLIGHT DECK DOOR: CLOSED AND LOCKED
      - PASSENGER SIGNS: ____
      - MCP: V2 ____ · HDG/TRK ____ · ALT ____
      - TAKEOFF SPEEDS: V1 ____ · VR ____ · V2 ____
      - CDU PREFLIGHT: COMPLETED
      - TRIM: ____ UNITS · 0 · 0
      - TAXI AND TAKEOFF BRIEFING: COMPLETED
      - BEACON: "ON"
        note: "747-8F: main deck cargo door closed and locked before the beacon goes on. A freighter's load is not self-loading — check the trim setting against the load sheet, not against habit."

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - PUSHBACK / START CLEARANCE: OBTAINED
      - ENGINE START SWITCH 4: START
      - FUEL CONTROL SWITCH 4: RUN
        note: Autostart — move the fuel control switch to RUN once the start selector is pulled; the EEC introduces fuel. GEnx starts slowly and quietly compared with a CF6 — a long motoring phase before EGT rise is normal, not a hung start.
      - ENGINE 3: START
      - ENGINE 2: START
      - ENGINE 1: START
      - APU BLEED: OFF
      - ENGINE PARAMETERS 1–4: STABILISED

  - id:   btaxi
    name: Before Taxi
    kind: checklist
    items:
      - ANTI-ICE: ____
      - RECALL: CHECKED
      - AUTOBRAKE: RTO
      - FLIGHT CONTROLS: CHECKED
      - GROUND EQUIPMENT: CLEAR

  - id:   btakeoff
    name: Before Takeoff
    kind: checklist
    items:
      - FLAPS: ____
        note: "Line-up flow, not on the card: transponder TA/RA, strobes and landing lights on, cabin secure."

  - id:   atakeoff
    name: After Takeoff
    kind: checklist
    items:
      - LANDING GEAR: UP
      - FLAPS: UP

  - id:   cruise
    name: Cruise / Fuel Check
    kind: flow
    items:
      - FUEL ON BOARD: CHECKED vs FLIGHT PLAN
      - FUEL BALANCE: WITHIN LIMITS
      - STEP CLIMB: AS PLANNED
      - POSITION: CROSSCHECKED
      - DESCENT PREP: ARRIVAL · APPROACH · MINIMUMS IN CDU

  - id:   descent
    name: Descent
    kind: checklist
    items:
      - RECALL: CHECKED
      - AUTOBRAKE: ____
      - LANDING DATA: VREF ____ · MINIMUMS ____
      - APPROACH BRIEFING: COMPLETED

  - id:   approach
    name: Approach
    kind: checklist
    items:
      - ALTIMETERS: ____

  - id:   landing
    name: Landing
    kind: checklist
    items:
      - SPEEDBRAKE: ARMED
      - LANDING GEAR: DOWN
      - FLAPS: ____

  - id:   shutdown
    name: Shutdown
    kind: checklist
    items:
      - HYDRAULIC PANEL: SET
      - FUEL PUMPS: "OFF"
      - FLAPS: UP
      - PARKING BRAKE: ____
      - FUEL CONTROL SWITCHES: CUTOFF
      - WEATHER RADAR: "OFF"

  - id:   secure
    name: Secure
    kind: checklist
    items:
      - IRSs: "OFF"
      - EMERGENCY LIGHTS: "OFF"
      - PACKS: "OFF"
