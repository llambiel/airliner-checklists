# A300 — Airbus A300-600R / -600F
id:   a300
code: A300   # tab label
name: Airbus A300-600
sub:  2 × CF6-80C2 / PW4158 · two-crew · conventional controls · flap/slat lever
manufacturer: Airbus
variants:
  - name: "-600R"
    note: The common passenger build, with the trim tank that gives it the R.
  - name: "-600F"
    note: Freighter, and how most A300-600s still earn their living. Main deck door, wide CG range.
  - name: B4
    note: The earlier three-crew A300 with a flight engineer's panel. Different aeroplane to operate — these items only partly apply.

phases:

  - id:   prelim
    name: Preliminary Cockpit Prep
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - BAT 1 + 2: "ON"
      - EXT PWR / APU: AS REQUIRED
      - APU FIRE TEST: PERFORMED
      - APU MASTER / START: ON — AVAIL
      - IRS 1 / 2 / 3: NAV
        note: No fly-by-wire here — the A300-600 flies on cables and hydraulics with a conventional yoke. It is an Airbus that handles like a Boeing.
      - HYD BLUE / GREEN / YELLOW: CHECKED
      - ACCU PRESS: GREEN BAND
      - EXTERIOR / COCKPIT LIGHTS: AS REQUIRED
      - OXYGEN: TESTED — CREW SUPPLY ON
      - PARKING BRAKE: "ON"

  - id:   prep
    name: Cockpit Preparation
    kind: flow
    items:
      - GEAR LEVER: DOWN
      - FLAP / SLAT LEVER: 0 / 0
      - SPEED BRAKE LEVER: RETRACTED — DISARMED
      - ENGINE START LEVERS: "OFF"
      - ENG MODE SELECTOR: NORM
      - FUEL PUMPS: ON — QUANTITY CHECKED
      - TRIM TANK: AUTO
        note: Fitted on the -600R — fuel moves aft in cruise for a rearward CG and comes forward again before descent.
      - SIGNS: ON / AUTO
      - EMER EXIT LT: ARM
      - ANTI ICE: AS REQUIRED
      - WEATHER RADAR: "OFF"
      - TRANSPONDER: CODE SET — STBY
      - FMS CDU: INIT · F-PLN · PERF
      - TAKEOFF DATA: V1 / VR / V2 · FLEX · TRIM SET
      - BARO REF: SET & CROSSCHECKED
      - FCU: SPD / HDG / ALT SET
      - TAKEOFF BRIEFING: COMPLETED

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - COCKPIT PREP: COMPLETED
      - GEAR PINS & COVERS: REMOVED
      - SIGNS: ON / AUTO
      - IRS: NAV
      - FUEL QUANTITY: ____ KG — CHECKED
      - TAKEOFF DATA: SET
      - BARO REF: ____ SET
      - divider: Below the line
      - WINDOWS / DOORS: CLOSED
      - BEACON: "ON"
      - THRUST LEVERS: IDLE
      - PARKING BRAKE: AS REQUIRED
      - MAIN DECK CARGO DOOR: CLOSED AND LOCKED
        only:
          - "-600F"
      - LOAD & RESTRAINT: SECURED — LOADSHEET CHECKED
        only:
          - "-600F"
        note: A freighter's CG range is wider than the passenger version's and the load is not self-loading. Check the trim setting against the load sheet, not against habit.

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - PUSHBACK / START CLEARANCE: OBTAINED
      - ENG MODE SELECTOR: IGN / START
      - ENGINE 2 START: ENGAGED
      - START LEVER 2: ON AT 20% N2
        note: Older FADEC logic than the A320 family — the crew watches the start rather than the computer doing it all.
      - ENGINE 1: START
      - ENG MODE SELECTOR: NORM
      - APU BLEED: "OFF"
      - ENGINE PARAMETERS: STABILISED

  - id:   astart
    name: After Start
    kind: checklist
    items:
      - ANTI ICE: AS REQUIRED
      - ECAM / ANNUNCIATORS: CHECKED
      - PITCH TRIM: ____ SET
      - RUDDER TRIM: ZERO
      - GROUND EQUIPMENT: CLEAR

  - id:   taxi
    name: Taxi / Before Takeoff
    kind: checklist
    items:
      - FLIGHT CONTROLS: CHECKED — FULL & FREE
      - FLAPS / SLATS: 15 / 0 SET
      - V1 / VR / V2: ____ SET
      - ATC: SET
      - TAKEOFF CONFIG: TEST — NORMAL
      - TAKEOFF RWY: ____ CONFIRMED
      - CABIN CREW: ADVISED
      - divider: Line-up items
      - PACKS: AS REQUIRED
      - ENG MODE SELECTOR: IGN IF RAIN / ICE
      - TCAS: TA / RA
      - EXTERIOR LIGHTS: STROBE · T.O · RWY TURN OFF
      - CHRONO: START
      - MAIN DECK FIRE SUPPRESSION: ARMED
        only:
          - "-600F"
      - SUPERNUMERARIES: BRIEFED
        only:
          - "-600F"

  - id:   climb
    name: After Takeoff / Climb
    kind: checklist
    items:
      - LANDING GEAR: UP
      - FLAPS / SLATS: 0 / 0
      - PACKS: "ON"
      - ENG MODE SELECTOR: NORM
      - APU: "OFF"
      - TRIM TANK TRANSFER: AFT — MONITORED
      - EXTERIOR LIGHTS: SET
      - BARO REF: STD SET AT TRANS ALT

  - id:   cruise
    name: Cruise / Fuel Check
    kind: flow
    items:
      - FUEL ON BOARD: CHECKED vs FLIGHT PLAN
      - TRIM TANK: TRANSFER MONITORED
      - FUEL BALANCE: WITHIN LIMITS
      - POSITION: CROSSCHECKED
      - ETOPS: AS REQUIRED
      - DESCENT PREP: ARRIVAL · APPROACH · MINIMA IN FMS

  - id:   appr
    name: Approach
    kind: checklist
    items:
      - TRIM TANK: FWD TRANSFER COMPLETE
      - BRIEFING: CONFIRMED
      - ANNUNCIATORS: CHECKED
      - SEAT BELTS: "ON"
      - BARO REF: ____ SET
      - MDA / DH: ____ SET
      - ENG MODE SELECTOR: AS REQUIRED

  - id:   land
    name: Landing
    kind: checklist
    items:
      - CABIN CREW: ADVISED
      - AUTO BRAKE: AS REQUIRED
      - LANDING GEAR: DOWN — 3 GREEN
      - SPOILERS: ARMED
      - FLAPS / SLATS: 20 / 40 SET
      - SIGNS: "ON"

  - id:   aland
    name: After Landing
    kind: checklist
    items:
      - FLAPS / SLATS: 0 / 0
      - SPOILERS: DISARMED
      - APU: START
      - RADAR: "OFF"
      - ENG MODE SELECTOR: NORM
      - ANTI ICE: AS REQUIRED
      - BRAKE TEMP: CHECKED
      - TRANSPONDER: STBY

  - id:   park
    name: Parking
    kind: checklist
    items:
      - APU BLEED: "ON"
      - ENGINE START LEVERS: "OFF"
      - SEAT BELTS: "OFF"
      - EXTERIOR LIGHTS: AS REQUIRED
      - FUEL PUMPS: "OFF"
      - PARK BRK / CHOCKS: AS REQUIRED

  - id:   secure
    name: Securing the Aircraft
    kind: checklist
    items:
      - IRS: "OFF"
      - OXYGEN: "OFF"
      - APU BLEED: "OFF"
      - EXTERIOR LIGHTS: "OFF"
      - APU & BAT 1 + 2: "OFF"
