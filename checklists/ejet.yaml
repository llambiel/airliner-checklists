# E-Jets — Embraer 170 / 175 / 190 / 195
id:   ejet
code: E-Jet   # tab label
name: Embraer E-Jets
sub:  2 × GE CF34 · two-crew · Primus Epic five-display flight deck · flaps 1–5 / FULL
manufacturer: Embraer
variants:
  - name: E170
    note: The baseline, CF34-8E. Around 70 seats and the shortest of the family.
  - name: E175
    note: The regional workhorse in North America — same CF34-8E, slightly stretched.
  - name: E190
    note: Bigger wing and CF34-10E engines. Enough aeroplane to sit against a 737 on thin routes.
  - name: E195
    note: The longest of the first-generation family. Same flows, more seats, less range.

phases:

  - id:   power
    name: Power Up
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - BATTERY 1: ON (R)
        note: Make sure the aircraft does not move before the IESS has initialised.
      - BATTERY 2: AUTO (R)
        note: Only displays 2 and 3 should come alive at this point.
      - BATTERIES VOLTAGE: CKD (R)
      - EICAS MESSAGES: CKD (R)
      - GPU BUTTON (IF APPLICABLE): PUSHED IN (R)
      - EMERGENCY LIGHTS: ON, THEN ARMED (R)
      - FIRE EXTINGUISHER PANEL: TEST (R)
      - APU: AS RQD (R)
      - NAV LIGHTS: ON (R)
      - HYDRAULIC PANEL: AS RQD (R)
      - ELECTRONIC CBs: CKD (R)
      - DVDR CONTROL PANEL: CKD (R)
      - COCKPIT REINFORCED DOOR PANEL: CKD (B)
      - PHOTOLUMINESCENT STRIPS: CKD (R)

  - id:   scan
    name: Internal Safety Inspection
    kind: flow
    items:
      - AIRPLANE MANUALS & DOCUMENTS: ON BOARD (L)
      - MAINTENANCE STATUS: CKD (B)
      - COCKPIT EMER. EQUIP: CKD (R)
      - ELECTRIC PANEL: SET (R)
      - FUEL PANEL: CKD (R)
      - PASSENGER SIGNS PANEL: SET (R)
      - WINDSHIELD WIPER SELECTORS: OFF (R)
      - HYDRAULIC PANEL: CKD (R)
      - AIR COND / PNEUMATIC PANEL: CKD (R)
      - PAX OXY PANEL: CKD (R)
      - ELT: ARM (R)
      - LANDING GEAR LEVER: DOWN (R)
      - START/STOP SELECTORS: STOP (R)
      - SPEED BRAKE LEVER: CLOSED (R)
      - RAT MANUAL DEPLOY: STOWED (R)
      - SLAT/FLAP LEVER: VERIFY POS (R)
      - CIRCUIT BREAKERS: CKD (B)
      - JUMP SEAT OXY MASK, REGULATORS: CKD (R)
      - L/GEAR PINS (3) & RAT SAFETY PIN: STOWED (L)

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - PASSENGER SIGNS PANEL: SET (L)
      - PRESSURIZATION PANEL: SET (L)
      - OXYGEN MASKS: CKD (B)
      - FLIGHT INSTRUMENTS: X-CKD (L)
      - THRUST LEVERS: IDLE (L)
      - FUEL QTY: ____ PLANNED / ____ ON BOARD (L)
      - MCDU: SET (L)
      - DOORS & WINDOWS: CLSD & LCKD (B)
      - HYD PUMP 3A: ON (L)
      - RED BEACON: ON (L)
      - TRANSPONDER: TA/RA (L)
      - EMERGENCY / PARKING BRAKE: AS RQD (L)

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - PUSHBACK / START CLEARANCE: OBTAINED
      - START/STOP SELECTOR 2: START
      - FUEL: INTRODUCED AT 20% N2
        note: The FADEC runs the start and will abort it by itself on a hot or hung start. Monitor ITT and N2 and keep your hand off the selector.
      - START/STOP SELECTOR 1: START
      - APU BLEED: AS REQUIRED
      - ENGINE PARAMETERS: STABILISED

  - id:   astart
    name: After Start
    kind: checklist
    items:
      - GROUND EQUIPMENT: REMOVED (L)
      - TAKEOFF TRIM: ____ SET / ZERO / ZERO (L)
      - SLAT / FLAP: ____ SET (L)
      - FLIGHT CONTROLS: CKD (L)
      - APU: AS RQD (L)

  - id:   btakeoff
    name: Before Takeoff
    kind: checklist
    items:
      - CABIN: NOTIFIED (R)
      - BRAKE TEMPS: GREEN (L)
      - EICAS: CKD (L)
      - TAKEOFF CONFIGURATION: CKD (L)

  - id:   atakeoff
    name: After Takeoff
    kind: checklist
    items:
      - LANDING GEAR: UP (PM)
      - SLAT / FLAP: 0 (PM)
      - APU: AS RQD (PM)

  - id:   cruise
    name: Cruise
    kind: flow
    items:
      - FUEL: CHECKED vs FLIGHT PLAN
      - FUEL BALANCE: WITHIN LIMITS
      - CRUISE LEVEL: AS PLANNED
      - WEATHER RADAR: AS REQUIRED
      - DESCENT PREP: ARRIVAL · APPROACH · MINIMUMS IN FMS

  - id:   descent
    name: Approach
    kind: checklist
    items:
      - BRIEFING: COMPLETE (PF)
      - LANDING DATA: SET (PF)
      - PASSENGER SIGNS PANEL: SET (PM)
      - NAVAIDS & NAV ACCURACY: VERIFIED (PM)
      - MINIMUMS: ____ BARO / RA (B)
      - ALTIMETERS: ____ SET & X-CKD (B)

  - id:   land
    name: Before Landing
    kind: checklist
    items:
      - EICAS: CKD (PF)
      - LANDING GEAR: DOWN (B)
      - SLAT / FLAP: ____ SET (B)

  - id:   aland
    name: After Landing
    kind: flow
    items:
      - FLAPS: "0"
      - SPEEDBRAKE: RETRACTED
      - APU: START AS REQUIRED
      - ANTI-ICE: AS REQUIRED
      - TRANSPONDER: STBY
      - WEATHER RADAR: "OFF"

  - id:   shutdown
    name: Shutdown
    kind: checklist
    items:
      - EMER / PARKING BRAKE: SET (L)
      - PASSENGER SIGNS PANEL: SET (L)
      - START/STOP SELECTORS: STOP (L)
      - ENGINES: OFF (L)
      - HYDRAULIC PANEL: SET (L)
      - RED BEACON: OFF (L)
      - TRANSPONDER: STBY (L)
      - NAVAIDS & NAV ACCURACY: RESET (R)

  - id:   secure
    name: Leaving the Aircraft
    kind: checklist
    items:
      - PASSENGER SIGNS PANEL: ALL OFF (L)
      - GPU / APU: OFF (L)
      - EXTERNAL LIGHTS: OFF (L)
      - BATTERIES 1 & 2: OFF (L)
