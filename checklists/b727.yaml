# 727 — Boeing 727-100 / -200 / -200 Advanced
id:   b727
code: "727"   # tab label
name: Boeing 727
sub:  3 × JT8D tail-mounted · three-crew · EPR thrust · flaps 2/5/15/25/30/40
manufacturer: Boeing
variants:
  - name: "-100"
    note: The original short body. Lightest, and the one that could get into the small fields the type was designed for.
  - name: "-200"
    note: Stretched by 6 m. Watch the tail strike margin — the aft body sits close to the runway on rotation.
  - name: "-200 Advanced"
    note: Higher weights, JT8D-17s and an APU as standard. Most surviving -200s are Advanced.
  - name: "-200F"
    note: Freighter conversion. No cabin items; brief the loadmaster and check the trim against the load sheet.

phases:

  - id:   power
    name: Power Up
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - BATTERY: "ON"
      - EXT PWR / APU: ON — BUS TIES CLOSED
      - ESSENTIAL POWER: NORMAL
      - EMERGENCY LIGHTS: ARM
      - GALLEY POWER: "ON"
      - PARKING BRAKE: SET

  - id:   fepanel
    name: Flight Engineer Panel
    kind: flow
    items:
      - ELECTRICAL: GENERATORS OFF — BUS TIES CLOSED
      - HYDRAULICS A / B: PUMPS OFF UNTIL START
      - PNEUMATICS: PACKS OFF — ISOLATION AS REQUIRED
      - FUEL PANEL: TANKS 1 / 2 / 3 — PUMPS ON
        note: Tank 2 is the centre tank and feeds first. Nothing balances the mains for you — the engineer does it by hand with the crossfeeds.
      - CROSSFEED VALVES: CLOSED
      - PRESSURIZATION: FLT & LAND ALT SET — RATE MID
      - ANTI-ICE: "OFF"
      - AIR CONDITIONING: SET
      - EPR / TAKEOFF DATA: COMPUTED — BUGS SET
        note: JT8Ds are rated in EPR. The engineer works the numbers from the charts and sets the bugs; there is no FMC to do it.

  - id:   preflight
    name: Preflight
    kind: checklist
    items:
      - GEAR PINS: REMOVED
      - OXYGEN: TESTED — CREW & PASSENGER
      - FLIGHT INSTRUMENTS: SET & CROSSCHECKED
      - ALTIMETERS: ____ SET
      - RADIOS & NAVAIDS: SET
      - STAB TRIM: ____ UNITS
      - TAKEOFF BRIEFING: COMPLETE

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - DOORS & AIRSTAIRS: CLOSED
      - FUEL: ____ KG — PUMPS ON
      - PNEUMATIC PRESSURE: CHECKED
      - HYDRAULICS: CHECKED
      - ANTI COLLISION LIGHT: "ON"
      - PARKING BRAKE: SET
      - START CLEARANCE: OBTAINED
      - MAIN DECK CARGO DOOR: CLOSED AND LOCKED
        only:
          - "-200F"
      - LOAD & RESTRAINT: SECURED — LOADSHEET CHECKED
        only:
          - "-200F"
        note: A freighter's CG range is wider than the passenger version's and the load is not self-loading. Check the trim setting against the load sheet, not against habit.

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - IGNITION: LOW
      - ENGINE 3 START: ENGAGED
        note: Order varies by operator — 3-1-2 with the centre engine last is common. Follow your add-on's checklist.
      - START LEVER 3: IDLE AT 20% N2
      - ENGINE 1: START
      - ENGINE 2: START
        note: No. 2 breathes through the S-duct in the tail, so its start looks and sounds different from the pods.
      - GENERATORS: ON — LOADS CHECKED
      - PACKS: "ON"

  - id:   astart
    name: After Start
    kind: checklist
    items:
      - GENERATORS: ON — PARALLEL
      - HYDRAULIC PUMPS: "ON"
      - PACKS: "ON"
      - FLAPS: ____ SET — LEADING EDGE GREEN
      - FLIGHT CONTROLS: CHECKED
      - GROUND EQUIPMENT: CLEAR

  - id:   taxi
    name: Taxi
    kind: checklist
    items:
      - BRAKES: CHECKED
      - FLIGHT INSTRUMENTS: NO FLAGS
      - YAW DAMPER: "ON"
      - TRANSPONDER: "ON"
      - TAXI CLEARANCE: ____ CONFIRMED

  - id:   btakeoff
    name: Before Takeoff
    kind: checklist
    items:
      - FLAPS: ____ — GREEN LIGHT
      - STAB TRIM: ____ UNITS
      - EPR BUGS: SET
      - GROUND SPOILERS: ARMED
      - ANTI-SKID: "ON"
      - ANNUNCIATOR PANEL: CHECKED
      - CABIN: SECURE
      - divider: Line-up items
      - IGNITION: CONTINUOUS
      - EXTERIOR LIGHTS: STROBES · LANDING · ON
      - TAKEOFF CLEARANCE: RECEIVED
      - MAIN DECK FIRE SUPPRESSION: ARMED
        only:
          - "-200F"
      - SUPERNUMERARIES: BRIEFED
        only:
          - "-200F"

  - id:   atakeoff
    name: After Takeoff
    kind: checklist
    items:
      - LANDING GEAR: UP
      - FLAPS: UP — LEADING EDGE RETRACTED
      - IGNITION: "OFF"
      - PRESSURIZATION: CHECKED
      - ALTIMETERS: STD AT TRANS ALT

  - id:   cruise
    name: Cruise
    kind: flow
    items:
      - FUEL: BALANCED — CROSSFEEDS AS REQUIRED
      - CRUISE EPR: SET
      - PRESSURIZATION: CHECKED
      - SYSTEMS: ENGINEER MONITORING
      - DESCENT PREP: ARRIVAL · APPROACH · MINIMUMS BRIEFED

  - id:   descent
    name: In Range / Approach
    kind: checklist
    items:
      - divider: In range
      - CIRCUIT BREAKERS: CHECK (S)
      - IGNITION: FLT (S)
      - FUEL PANEL: CHECKED (S)
      - FUEL HEAT: AS REQUIRED, OFF (S)
      - HYDRAULIC PANEL: CHECKED (S)
      - AIR COND & PRESS: SET (S)
      - SEAT BELT & HARNESS: FASTENED (ALL)
      - LANDING LIGHTS: ON (PNF)
      - PACK COOLING DOORS: SET (S)
      - ALTIMETERS: SET ____ (ALL)
      - AIRSPEED BUGS: SET (CF)
      - EPR BUGS: SET (PNF)
      - divider: Approach
      - BRIEFING: COMPLETE (C)
      - ALTIMETERS: SET ____ (CF)
      - MINIMUMS: SET ____ (CF)
        note: The second officer reads. Called below FL180 (or cleared below the transition level) once the In-Range checklist and the approach briefing are done, and repeated if the approach changes.

  - id:   land
    name: Before Landing
    kind: checklist
    items:
      - LANDING GEAR: DOWN, IN, 3 GREEN (PNF) · CHECKED (S)
      - AUTOBRAKES: AS REQ / NOT INSTALLED (PNF)
      - AUTO SPOILERS: AS REQ / NOT INSTALLED (PNF)
        note: Arm the auto spoilers only once the speedbrakes are no longer needed for manoeuvring — using them afterwards means re-arming.
      - FLT & NAV INST: CROSS-CHECKED, NO FLAGS (PNF)
      - FLAPS: ____, GREEN LIGHT (PNF)
      - LANDING CLEARANCE: CLEARED TO LAND (PNF)
      - FUEL PANEL: SET (S)
        note: Tank-to-engine with all boost pumps on.
      - HYDRAULIC & BRAKE SYSTEM: CHECKED (S)
      - ANTISKID: ON, LIGHTS OUT (S)
      - LANDING LIGHTS: ON (PNF)

  - id:   aland
    name: After Landing
    kind: checklist
    items:
      - SPEED BRAKE LEVER: CHECKED, DETENT (CF)
      - LIGHTS: AS REQUIRED (F)
      - PITOT HEAT: OFF (F)
      - TRANSPONDER: STANDBY, OFF (F)
      - RADAR: OFF (F)
      - FLAPS: UP (F)
      - AIL & RUDDER TRIM: 0, 0 (F)
      - REVERSER OPERATING LIGHTS: OUT (S)
      - IGNITION: AS REQUIRED (S)
      - FLIGHT RECORDER: FLT / OFF / NOT INSTALLED (S)
      - ESSENTIAL POWER: GENERATOR 2 (S)
      - AC METERS SELECTOR: APU / EXT POWER (S)
      - FUEL BOOST PUMPS: ONE PER TANK (S)
      - HYDRAULIC PANEL: CHECKED (S)
      - OIL QUANTITY: CHECKED (S)
      - PRESSURIZATION: SET (S)
      - FLIGHT / GND SWITCH: GND (S)
      - RIGHT PACK: OFF (S)
      - APU: START AS REQUIRED (S)
      - LEFT PACK: AS REQUIRED (S)
      - BLEED AIR SWITCHES: OPEN (S)
      - SINGLE ENGINE SHUTDOWN: AS REQUIRED (C / S)
        note: Two lines of this section (stabilizer trim and anti-ice) are illegible on the scanned card and are left out.

  - id:   shutdown
    name: Shut Down
    kind: checklist
    items:
      - PARKING BRAKE: SET (C)
      - APU / EXT POWER: ON (S)
      - ESSENTIAL POWER: APU / EXT POWER (S)
      - START LEVERS: CUT OFF (C)
      - divider: Tow-in, when applicable
      - GND INTERCONNECT: CLOSED (S)
      - HYD PUMPS, QTY & PRESS: 2A OFF, 1B ON & CHECKED (S)
      - divider: All
      - BEACON: OFF (C)
      - ANTI-ICE: CLOSED (S)
      - IGNITION: OFF (S)
      - FUEL BOOST PUMPS: OFF (S)
      - HYDRAULIC PUMPS: 2A ON, 1B OFF (S)
      - CARGO DOOR: ARM (S)
      - ESCAPE SLIDE BAR: STOWED (S)
      - PARKING BRAKE: AS REQUIRED (C)

  - id:   secure
    name: Termination
    kind: checklist
    items:
      - WINDOW HEAT: OFF (F)
      - EMER EXIT LIGHTS: OFF (F)
      - HYDRAULIC PANEL: AS REQUIRED (S)
      - PACKS: OFF (S)
      - GASPER FAN: OFF (S)
      - APU: AS REQUIRED (S)
      - BATTERY: AS REQUIRED (S)
      - DC METER SELECTOR: TR 1 (S)
      - RADIOS, RADIO MASTERS: OFF / NOT INSTALLED
      - AML ENTRIES: COMPLETE (S)
        note: One line of this section (panel lights) is too faint to read on the scanned card and is left out.
