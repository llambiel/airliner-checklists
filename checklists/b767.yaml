# 767 — Boeing 767-200 / -300 / -400ER
id:   b767
code: "767"   # tab label
name: Boeing 767
sub:  2 × CF6-80C2 / PW4000 / RB211-524 · two-crew EICAS · flaps 1/5/15/20/25/30
manufacturer: Boeing
variants:
  - name: "-200ER"
    note: Short body, long legs. The aeroplane that made twin-engine ocean crossings ordinary.
  - name: "-300ER"
    note: The volume seller. 6.4 m stretch — rotate at a steady 2-3°/s to keep the tail clear.
  - name: "-300F"
    note: Freighter with the main deck door. Wide CG range, so check the trim setting against the load sheet.
  - name: "-400ER"
    note: Longest of the family with a raked wingtip and a 777-style flight deck. Same flows, different screens.

phases:

  - id:   power
    name: Power Up
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - BATTERY: "ON"
      - STANDBY POWER: AUTO
      - GRD PWR / APU: "ON"
      - EMERGENCY LIGHTS: ARMED
      - IRS L / C / R: NAV
      - CDU: POS INIT · ROUTE · PERF INIT
      - PARKING BRAKE: SET

  - id:   scan
    name: Preflight Scan
    kind: flow
    items:
      - OXYGEN: TESTED — 100%
      - WINDOW HEAT: "ON"
      - PROBE HEAT: AUTO
      - HYDRAULICS L / C / R: PUMPS ON — DEMAND AUTO
      - PACKS: AUTO
      - BLEEDS: "ON"
      - ISOLATION VALVES: AUTO
      - PRESSURIZATION: AUTO — LAND ALT SET
      - FUEL PUMPS: ON — L / C / R AS LOADED
      - FUEL CONTROL SWITCHES: CUTOFF
      - SPEEDBRAKE: DOWN DETENT
      - FLAPS: UP
      - EICAS: NO MESSAGES — RECALL CHECKED
      - TAKEOFF DATA: THRUST · V-SPEEDS · STAB TRIM SET

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - FLIGHT DECK DOOR: CLOSED AND LOCKED
      - PASSENGER SIGNS: SET
      - WINDOWS: LOCKED
      - FUEL: ____ KG — PUMPS ON
      - HYDRAULIC PANEL: SET
      - FLIGHT INSTRUMENTS: SET & CROSSCHECKED
      - TAKEOFF SPEEDS: V1 ____ · VR ____ · V2 ____
      - STAB TRIM: ____ UNITS
      - TAKEOFF BRIEFING: COMPLETED
      - BEACON: "ON"
      - PARKING BRAKE: SET
      - MAIN DECK CARGO DOOR: CLOSED AND LOCKED
        only:
          - "-300F"
      - LOAD & RESTRAINT: SECURED — LOADSHEET CHECKED
        only:
          - "-300F"
        note: A freighter's CG range is wider than the passenger version's and the load is not self-loading. Check the trim setting against the load sheet, not against habit.

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - PUSHBACK / START CLEARANCE: OBTAINED
      - ENGINE START SWITCH R: GRD
      - FUEL CONTROL SWITCH R: RUN AT 20% N2
        note: Big-fan spool-up is slow and quiet. Watch for N2 hanging with EGT rising — that is a hung start, not a slow one.
      - ENGINE START SWITCH L: GRD
      - FUEL CONTROL SWITCH L: RUN AT 20% N2
      - APU BLEED: "OFF"
      - ENGINE PARAMETERS: STABILISED

  - id:   btaxi
    name: Before Taxi
    kind: checklist
    items:
      - GENERATORS: "ON"
      - PROBE HEAT: "ON"
      - ANTI-ICE: AS REQUIRED
      - RECALL: CHECKED
      - AUTOBRAKE: RTO
      - FLIGHT CONTROLS: CHECKED
      - GROUND EQUIPMENT: CLEAR

  - id:   btakeoff
    name: Before Takeoff
    kind: checklist
    items:
      - FLAPS: ____ — GREEN LIGHT
      - STABILIZER TRIM: ____ UNITS
      - CABIN: SECURE
      - divider: Line-up items
      - TRANSPONDER: TA/RA
      - STROBES & LANDING LIGHTS: "ON"
      - TAKEOFF CLEARANCE: RECEIVED
      - MAIN DECK FIRE SUPPRESSION: ARMED
        only:
          - "-300F"
      - SUPERNUMERARIES: BRIEFED
        only:
          - "-300F"

  - id:   atakeoff
    name: After Takeoff
    kind: checklist
    items:
      - LANDING GEAR: UP AND OFF
      - FLAPS: UP — NO LIGHTS
      - PACKS: AUTO
      - ALTIMETERS: SET

  - id:   cruise
    name: Cruise
    kind: flow
    items:
      - FUEL ON BOARD: CHECKED vs FLIGHT PLAN
      - CENTER TANK: TRANSFERRING — PUMPS OFF WHEN EMPTY
      - FUEL BALANCE: WITHIN LIMITS
      - ETOPS: AS REQUIRED
      - STEP CLIMB: AS PLANNED
      - DESCENT PREP: ARRIVAL · APPROACH · MINIMUMS IN CDU

  - id:   descent
    name: Descent
    kind: checklist
    items:
      - PRESSURIZATION: LAND ALT ____
      - RECALL: CHECKED
      - AUTOBRAKE: ____ SET
      - LANDING DATA: VREF ____ · MINIMUMS ____
      - APPROACH BRIEFING: COMPLETED

  - id:   approach
    name: Approach
    kind: checklist
    items:
      - ALTIMETERS: ____ SET
      - SEAT BELTS: "ON"

  - id:   landing
    name: Landing
    kind: checklist
    items:
      - SPEEDBRAKE: ARMED — GREEN LIGHT
      - LANDING GEAR: DOWN — 3 GREEN
      - FLAPS: ____ — GREEN LIGHT

  - id:   shutdown
    name: Shutdown
    kind: checklist
    items:
      - FUEL PUMPS: "OFF"
      - HYDRAULIC PANEL: SET
      - FLAPS: UP
      - PARKING BRAKE: SET
      - FUEL CONTROL SWITCHES: CUTOFF
      - WEATHER RADAR: "OFF"
      - ANTI-ICE: "OFF"

  - id:   secure
    name: Secure
    kind: checklist
    items:
      - IRS L / C / R: "OFF"
      - EMERGENCY LIGHTS: "OFF"
      - WINDOW HEAT: "OFF"
      - PACKS: "OFF"
      - APU: "OFF"
