# 777 — Boeing 777-200ER / -300ER / -200LR / -F
id:   b777
code: "777"   # tab label
name: Boeing 777
sub:  2 × GE90 / Trent 800 / PW4000 · two-crew fly-by-wire · flaps 1/5/15/20/25/30
manufacturer: Boeing
variants:
  - name: "-200ER"
    note: The original long-range twin. Lighter and shorter than the -300ER, and it shows on the takeoff roll.
  - name: "-300ER"
    note: The volume seller. GE90-115Bs, semi-levered gear and a tail skid — rotate at a steady 2°/s and let it fly off.
  - name: "-200LR"
    note: Built for the very long sectors. Same flows, more fuel and a heavier landing to plan.
  - name: "-200F"
    note: Freighter with the main deck door. Wide CG range, so check the trim setting against the load sheet.

phases:

  - id:   power
    name: Power Up
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - BATTERY: "ON"
      - EXT PWR / APU: "ON"
      - EMERGENCY LIGHTS: ARMED
      - ADIRU: "ON — ALIGNING"
      - EFIS / DISPLAYS: SET
      - CDU: POS INIT · ROUTE · PERF INIT
      - PARKING BRAKE: SET

  - id:   scan
    name: Preflight Scan
    kind: flow
    items:
      - OXYGEN: TESTED — 100%
      - WINDOW HEAT: "ON"
      - PROBE HEAT: AUTO
      - HYDRAULICS L / C / R: PUMPS ON — DEMAND AUTO
      - PACKS: AUTO
      - BLEEDS: "ON"
      - PRESSURIZATION: AUTO — LAND ALT SET
      - FUEL PUMPS: ON — L / C / R AS LOADED
      - FUEL CONTROL SWITCHES: CUTOFF
      - SPEEDBRAKE: DOWN DETENT
      - FLAPS: UP
      - EICAS: NO MESSAGES — RECALL CHECKED
      - TAKEOFF DATA: THRUST · V-SPEEDS · STAB TRIM SET
        note: Fly-by-wire with a conventional yoke and real control feel — Boeing's answer to the sidestick, and it lands like a much smaller aeroplane.

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - FLIGHT DECK DOOR: CLOSED AND LOCKED
      - PASSENGER SIGNS: ____
      - MCP: V2 ____ · HDG/TRK ____ · ALT ____
      - TAKEOFF SPEEDS: V1 ____ · VR ____ · V2 ____
      - CDU PREFLIGHT: COMPLETED
      - TRIM: ____ UNITS · 0 · 0
      - TAXI AND TAKEOFF BRIEFING: COMPLETED
      - BEACON: "ON"
        note: "-200F: main deck cargo door closed and locked before the beacon goes on. A freighter's load is not self-loading — check the trim setting against the load sheet, not against habit."

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - PUSHBACK / START CLEARANCE: OBTAINED
      - ENGINE START SELECTOR 2: START
      - FUEL CONTROL SWITCH 2: RUN
        note: Autostart — move the fuel control switch to RUN as soon as the selector is in START; the EEC schedules fuel and ignition and will abort a bad start. The GE90's fan barely appears to move at first — watch N2 and EGT, not the fan.
      - ENGINE START SELECTOR 1: START
      - FUEL CONTROL SWITCH 1: RUN
      - APU BLEED: "OFF"
      - ENGINE PARAMETERS: STABILISED

  - id:   btaxi
    name: Before Taxi
    kind: checklist
    items:
      - ANTI-ICE: ____
      - RECALL: CHECKED
      - AUTOBRAKE: RTO
      - FLIGHT CONTROLS: CHECKED
      - GROUND EQUIPMENT: CLEAR

  - id:   btakeoff
    name: Before Takeoff
    kind: checklist
    items:
      - FLAPS: ____
        note: "Line-up flow, not on the card: transponder TA/RA, strobes and landing lights on, cabin secure."

  - id:   atakeoff
    name: After Takeoff
    kind: checklist
    items:
      - LANDING GEAR: UP
      - FLAPS: UP

  - id:   cruise
    name: Cruise
    kind: flow
    items:
      - FUEL ON BOARD: CHECKED vs FLIGHT PLAN
      - CENTER TANK: TRANSFERRING — PUMPS OFF WHEN EMPTY
      - FUEL BALANCE: WITHIN LIMITS
      - ETOPS: AS REQUIRED
      - STEP CLIMB: AS PLANNED
      - DESCENT PREP: ARRIVAL · APPROACH · MINIMUMS IN CDU

  - id:   descent
    name: Descent
    kind: checklist
    items:
      - RECALL: CHECKED
      - AUTOBRAKE: ____
      - LANDING DATA: VREF ____ · MINIMUMS ____
      - APPROACH BRIEFING: COMPLETED

  - id:   approach
    name: Approach
    kind: checklist
    items:
      - ALTIMETERS: ____

  - id:   landing
    name: Landing
    kind: checklist
    items:
      - SPEEDBRAKE: ARMED
      - LANDING GEAR: DOWN
      - FLAPS: ____
        note: On the -300ER the main gear is a long way behind you and the body steers — hold the centreline into the turn rather than cutting it.

  - id:   shutdown
    name: Shutdown
    kind: checklist
    items:
      - HYDRAULIC PANEL: SET
      - FUEL PUMPS: "OFF"
      - FLAPS: UP
      - PARKING BRAKE: ____
      - FUEL CONTROL SWITCHES: CUTOFF
      - WEATHER RADAR: "OFF"

  - id:   secure
    name: Secure
    kind: checklist
    items:
      - ADIRU: "OFF"
      - EMERGENCY LIGHTS: "OFF"
      - PACKS: "OFF"
