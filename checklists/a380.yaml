# A380 — Airbus A380-800
id:   a380
code: A380   # tab label
name: Airbus A380-800
sub:  4 × Trent 900 / GP7200 · two decks · CONF 1+F / 2 / 3
manufacturer: Airbus
variants:
  - name: Trent 900
    note: Rolls-Royce three-shaft — N1/N2/N3 on the ECAM. The original and most common fit.
  - name: GP7200
    note: Engine Alliance two-shaft. Same procedures, different ECAM parameters and start behaviour.

phases:

  - id:   prelim
    name: Preliminary Cockpit Prep
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - BAT 1–4: "ON"
      - EXT PWR / APU: AS REQUIRED
        note: Four generators, four batteries and two APU generators — the electrical page is worth a proper look before you power anything else.
      - APU FIRE TEST: PERFORMED
      - APU MASTER / START: ON — AVAIL
      - ADIRS 1 / 2 / 3: NAV
      - HYD GREEN / YELLOW: CHECKED
        note: Two hydraulic systems at 5,000 psi plus electric backup actuators — there is no blue system to check.
      - OIS / EFB: LOADED
      - OXYGEN: TESTED — CREW SUPPLY ON
      - PARKING BRAKE: "ON"

  - id:   prep
    name: Cockpit Preparation
    kind: flow
    items:
      - GEAR LEVER: DOWN
      - FLAP LEVER: AGREES WITH SURFACES
      - SPEED BRAKE LEVER: RETRACTED — DISARMED
      - ENG MASTERS 1–4: OFF
      - ENG START SELECTOR: NORM
      - FUEL: PUMPS ON — TRANSFER AUTO
        note: Eleven tanks and a trim tank in the tail. Leave the transfer in AUTO and watch the CG readout rather than the individual tanks.
      - SIGNS: ON / AUTO
      - EMER EXIT LT: ARM
      - ANTI ICE: AS REQUIRED
      - WEATHER RADAR / PWS: AUTO
      - TRANSPONDER: CODE SET — STBY
      - MFD FMS: INIT · F-PLN · PERF · FUEL & LOAD
      - TAKEOFF DATA: V1 / VR / V2 · FLEX · THR RED / ACC
      - BARO REF: SET & CROSSCHECKED
      - FCU: SPD / HDG / ALT SET
      - TAKEOFF BRIEFING: COMPLETED

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - COCKPIT PREP: COMPLETED
      - GEAR PINS & COVERS: REMOVED
      - SIGNS: ON / AUTO
      - ADIRS: NAV
      - FUEL QUANTITY / CG: ____ KG — CHECKED
      - TO DATA: SET
      - BARO REF: ____ SET
      - divider: Below the line
      - WINDOWS / DOORS: CLOSED
      - BEACON: "ON"
      - THR LEVERS: IDLE
      - PARKING BRAKE: AS REQUIRED

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - PUSHBACK / START CLEARANCE: OBTAINED
      - ENG START SELECTOR: IGN / START
      - ENG MASTERS 1–4: ON IN SEQUENCE
        note: The FADEC runs an automatic sequence once the masters are on. Some operators start two engines at the gate and the rest while taxiing — follow your SOP and your add-on's checklist.
      - ENG START SELECTOR: NORM
      - APU BLEED: OFF
      - ENGINE PARAMETERS 1–4: STABILISED

  - id:   astart
    name: After Start
    kind: checklist
    items:
      - ANTI ICE: AS REQUIRED
      - ECAM STATUS: CHECKED
      - PITCH TRIM: ____ SET
      - RUDDER TRIM: ZERO

  - id:   taxi
    name: Taxi / Before Takeoff
    kind: checklist
    items:
      - FLIGHT CONTROLS: CHECKED — FULL & FREE
      - FLAP SETTING: CONF ____
      - V1 / VR / V2 / FLEX TEMP: ____ SET
      - ATC: SET
      - ECAM MEMO: TO — NO BLUE
      - T.O CONFIG: TEST — NORMAL
        sub: true
      - BODY GEAR STEERING: AVAIL
        sub: true
        note: 22 wheels and a 79 m wingspan. Use the taxi camera, hold the centreline until the turn is well past, and mind the Code F taxiway limits.
      - TAKEOFF RWY: ____ CONFIRMED
      - CABIN CREW: ADVISED — BOTH DECKS
      - divider: Line-up items
      - PACKS: AS REQUIRED
      - ENG START SELECTOR: IGN IF RAIN / ICE
      - TCAS: TA / RA
      - EXTERIOR LIGHTS: STROBE · T.O · RWY TURN OFF
      - CHRONO: START

  - id:   climb
    name: After Takeoff / Climb
    kind: checklist
    items:
      - LANDING GEAR: UP
      - FLAPS: RETRACTED
      - PACKS: "ON"
      - ENG START SELECTOR: NORM
      - APU: OFF
      - FUEL TRANSFER: AFT — MONITORED
      - EXTERIOR LIGHTS: SET
      - BARO REF: STD SET AT TRANS ALT

  - id:   cruise
    name: Cruise / Fuel & CG
    kind: flow
    items:
      - FUEL ON BOARD: CHECKED vs FLIGHT PLAN
      - TRIM TANK: TRANSFER MONITORED
      - CG: WITHIN LIMITS
      - POSITION / NAV ACCURACY: CROSSCHECKED
      - STEP CLIMB: AS PLANNED
      - DESCENT PREP: ARRIVAL · APPR · MINIMA IN FMS

  - id:   appr
    name: Approach
    kind: checklist
    items:
      - TRIM TANK: FWD TRANSFER COMPLETE
      - BRIEFING: CONFIRMED
      - ECAM STATUS: CHECKED
      - SEAT BELTS: "ON"
      - BARO REF: ____ SET
      - MDA / DH: ____ SET
      - ENG START SELECTOR: AS REQUIRED

  - id:   land
    name: Landing
    kind: checklist
    items:
      - CABIN CREW: ADVISED — BOTH DECKS
      - A/THR: SPEED / OFF
      - AUTO BRAKE: AS REQUIRED
      - ECAM MEMO: LDG — NO BLUE
      - LDG GEAR: DOWN
        sub: true
      - SIGNS: "ON"
        sub: true
      - SPLRS: ARM
        sub: true
      - FLAPS: CONF 3 / FULL
        sub: true

  - id:   aland
    name: After Landing
    kind: checklist
    items:
      - FLAPS: RETRACTED
      - SPOILERS: DISARMED
      - APU: START
      - RADAR / PWS: OFF
      - ENG START SELECTOR: NORM
      - ANTI ICE: AS REQUIRED
      - BRAKE TEMP: CHECKED
      - EXTERIOR LIGHTS: SET
      - TRANSPONDER: STBY / AUTO

  - id:   park
    name: Parking
    kind: checklist
    items:
      - APU BLEED: "ON"
      - ENG MASTERS 1–4: OFF
      - SEAT BELTS: OFF
      - EXTERIOR LIGHTS: AS REQUIRED
      - FUEL PUMPS: OFF
      - PARK BRK / CHOCKS: AS REQUIRED

  - id:   secure
    name: Securing the Aircraft
    kind: checklist
    items:
      - ADIRS: OFF
      - OXYGEN: OFF
      - APU BLEED: OFF
      - EXTERIOR LIGHTS: OFF
      - APU & BAT 1–4: OFF
