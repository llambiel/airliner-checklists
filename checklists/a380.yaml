# A380 — Airbus A380-800
id:   a380
code: A380   # tab label
name: Airbus A380-800
sub:  4 × Trent 900 / GP7200 · two decks · CONF 1+F / 2 / 3
manufacturer: Airbus
variants:
  - name: Trent 900
    note: Rolls-Royce three-shaft — N1/N2/N3 on the ECAM. The original and most common fit.
  - name: GP7200
    note: Engine Alliance two-shaft. Same procedures, different ECAM parameters and start behaviour.

phases:

  - id:   prelim
    name: Preliminary Cockpit Prep
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - ENG MASTER 1–4: "OFF"
      - ENG START SEL: NORM
      - WEATHER RADAR: "OFF"
      - LDG GEAR LEVER: DOWN
      - WIPERS: "OFF"
      - BAT 1 + 2 + ESS + APU: CHECK — AUTO
      - EXT PWR 1–4: AS RQRD
        note: Four generators, four batteries and two APU generators — the electrical page is worth a proper look before you power anything else.
      - APU FIRE: TEST
      - APU: START
      - APU BLEED: "ON"
      - ADIRS 1 / 2 / 3: NAV
      - COCKPIT LIGHTS: AS RQRD
      - OIS / EFB: LOADED — PERF APP READY
      - HYD GREEN / YELLOW: CHECK
        note: Two hydraulic systems at 5,000 psi plus electric backup actuators — there is no blue system to check.
      - PARKING BRAKE: "ON"
      - BRAKE PRESS: CHECK
      - FLAPS: CHECK POSITION
      - SPEED BRAKE LEVER: RET & DISARMED
      - GEAR PINS & COVERS: ON BOARD

  - id:   prep
    name: Cockpit Preparation
    kind: flow
    items:
      - divider: Overhead panel
      - RCDR GND CTL: "ON"
      - EVAC SWITCH: CAPT & PURS
      - EXT LT: NAV & LOGO ON · STROBE AUTO
      - SIGNS: SEAT BELTS ON · NO SMOKING AUTO
      - EMER EXIT LT: ARM
      - ANTI ICE: AS RQRD
      - LDG ELEV: AUTO
      - PACK FLOW / X BLEED: AS RQRD / AUTO
      - FUEL: PUMPS ON — TRANSFER AUTO
        note: Eleven tanks and a trim tank in the tail. Leave the transfer in AUTO and watch the CG readout rather than the individual tanks.
      - OXY CREW SUPPLY: "ON"
      - divider: Panels and pedestal
      - BARO REF: SET
      - FD / LS: ON / AS RQRD
      - KCCU / RMP: CHECKED
      - WEATHER RADAR / PWS: OFF / AUTO
      - ATC: CODE SET — STBY
      - divider: FMGS
      - MFD FMS: INIT · F-PLN · FUEL & LOAD · PERF
      - TAKEOFF DATA: V1 / VR / V2 · FLEX · THR RED / ACC
      - FCU: SPD / HDG / ALT SET
      - OXYGEN MASK: TEST
      - TAKEOFF BRIEFING: COMPLETED

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - COCKPIT PREP: COMPLETED (BOTH)
      - GEAR PINS & COVERS: REMOVED
      - SIGNS: ON / AUTO
      - ADIRS: NAV
      - FUEL QUANTITY: ____ KG
      - TO DATA: SET
      - BARO REF: ____ SET (BOTH)
      - divider: Below the line
      - WINDOWS / DOORS: CLOSED (BOTH)
      - BEACON: "ON"
      - THR LEVERS: IDLE
      - PARKING BRAKE: AS RQRD

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - ENG START SEL: IGN / START
      - ENG MASTERS 1–4: ON IN SEQUENCE
        note: The FADEC runs an automatic sequence once the masters are on. Some operators start two engines at the gate and the rest while taxiing — follow your SOP and your add-on's checklist.
      - divider: After engine start
      - ENG START SEL: NORM
      - APU BLEED: "OFF"
      - ENG ANTI ICE: AS RQRD
      - APU MASTER SW: AS RQRD
      - GROUND SPOILERS: ARM
      - RUDDER TRIM: ZERO
      - FLAPS: SET
      - PITCH TRIM: SET
      - ECAM STATUS: CHECK

  - id:   astart
    name: After Start
    kind: checklist
    items:
      - ANTI ICE: AS RQRD
      - ECAM STATUS: CHECKED
      - PITCH TRIM: ____ SET
      - RUDDER TRIM: ZERO

  - id:   taxi
    name: Before Takeoff
    kind: checklist
    items:
      - FLIGHT CONTROLS: CHECKED (BOTH)
        note: 22 wheels and a 79 m wingspan. Use the taxi camera, hold the centreline until the turn is well past, and mind the Code F taxiway limits.
      - FLT INST: CHECKED (BOTH)
      - BRIEFING: CONFIRMED
      - FLAP SETTING: CONF ____ (BOTH)
      - V1, VR, V2 / FLX TEMP: ____ (BOTH)
      - ATC: SET
      - ECAM MEMO: TO NO BLUE
      - AUTO BRK: MAX
        sub: true
      - SIGNS: "ON"
        sub: true
      - CABIN: CHECK
        sub: true
      - SPLRS: ARM
        sub: true
      - FLAPS: T.O
        sub: true
      - T.O CONFIG: NORMAL
        sub: true
      - divider: Below the line
      - TAKEOFF RWY: ____ (BOTH)
      - CABIN CREW: ADVISED
        note: Both decks.
      - TCAS: TA OR TA/RA
      - ENG START SEL: AS RQRD
      - PACKS: AS RQRD
        note: "Line-up flow, not on the card: exterior lights T.O, strobe ON, chrono start."

  - id:   climb
    name: After Takeoff / Climb
    kind: checklist
    items:
      - LDG GEAR: UP
      - FLAPS: RETRACTED
      - PACKS: "ON"
      - divider: Below the line
      - BARO REF: ____ SET (BOTH)
        note: Read at the transition altitude.

  - id:   cruise
    name: Cruise / Fuel Check
    kind: flow
    items:
      - FUEL ON BOARD: CHECKED vs FLIGHT PLAN
      - TRIM TANK: TRANSFER MONITORED
        note: Aft transfer in cruise, forward transfer back before descent — it should be complete by the approach.
      - CG: WITHIN LIMITS
      - POSITION / NAV ACCURACY: CROSSCHECKED
      - ETOPS: AS RQRD
      - STEP CLIMB: AS PLANNED
      - DESCENT PREP: ARRIVAL · APPR · MINIMA IN MCDU

  - id:   appr
    name: Approach
    kind: checklist
    items:
      - BRIEFING: CONFIRMED
      - ECAM STATUS: CHECKED
      - SEAT BELTS: "ON"
      - BARO REF: ____ SET (BOTH)
      - MINIMUM: ____ SET (BOTH)
      - ENG START SEL: AS RQRD

  - id:   land
    name: Landing
    kind: checklist
    items:
      - CABIN CREW: ADVISED
        note: Both decks.
      - A/THR: SPEED / OFF
      - AUTO BRAKE: AS RQRD
      - ECAM MEMO: LDG NO BLUE
      - LDG GEAR: DN
        sub: true
      - SIGNS: "ON"
        sub: true
      - CABIN: CHECK
        sub: true
      - SPLRS: ARM
        sub: true
      - FLAPS: SET
        sub: true

  - id:   aland
    name: After Landing
    kind: checklist
    items:
      - FLAPS: RETRACTED
      - SPOILERS: DISARMED
      - APU: START
      - RADAR: OFF / STBY
      - PWS: "OFF"

  - id:   park
    name: Parking
    kind: checklist
    items:
      - APU BLEED: "ON"
      - ENGINES: "OFF"
      - SEAT BELTS: "OFF"
      - EXT LT: AS RQRD
      - FUEL PUMPS: "OFF"
      - PARK BRK & CHOCKS: AS RQRD

  - id:   secure
    name: Securing the Aircraft
    kind: checklist
    items:
      - ADIRS: "OFF"
      - OXYGEN: "OFF"
      - APU BLEED: "OFF"
      - EMER EXIT LT: "OFF"
      - SIGNS: "OFF"
      - APU AND BAT: "OFF"
