# A340 — Airbus A340-300
id:   a340
code: A340   # tab label
name: Airbus A340-300
sub:  4 × CFM56-5C · long-haul quad · trim tank CG control
manufacturer: Airbus
variants:
  - name: "-200"
    note: Short body, long range. Same CFM56-5C flows as the -300.
  - name: "-300"
    note: The common CFM56 A340 and the basis for these checklists.
  - name: "-500 / -600"
    note: Different aeroplane underneath — Trent 500s and a four-wheel centre bogie. Engine and fuel items differ from what is listed here.

phases:

  - id:   prelim
    name: Preliminary Cockpit Prep
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - ENG MASTER 1–4: "OFF"
      - ENG START SEL: NORM
      - WEATHER RADAR: "OFF"
      - LDG GEAR LEVER: DOWN
      - WIPERS: "OFF"
      - BAT 1 + 2 + APU: CHECK > 25.5 V — AUTO
      - EXT PWR A / B: AS RQRD
      - APU FIRE: TEST
      - APU: START
      - APU BLEED: "ON"
      - ADIRS 1 / 2 / 3: NAV
      - COCKPIT LIGHTS: AS RQRD
      - ACCU PRESS: CHECK
      - PARKING BRAKE: "ON"
      - BRAKE PRESS: CHECK
      - FLAPS: CHECK POSITION
      - SPEED BRAKE LEVER: RET & DISARMED
      - GEAR PINS & COVERS: ON BOARD

  - id:   prep
    name: Cockpit Preparation
    kind: flow
    items:
      - divider: Overhead panel
      - RCDR GND CTL: "ON"
      - EVAC SWITCH: CAPT & PURS
      - EXT LT: NAV & LOGO ON · STROBE AUTO
      - SIGNS: SEAT BELTS ON · NO SMOKING AUTO
      - EMER EXIT LT: ARM
      - ANTI ICE: AS RQRD
      - LDG ELEV: AUTO
      - PACK FLOW / X BLEED: AS RQRD / AUTO
      - FUEL PUMPS: "ON"
      - TRIM TK MODE: AUTO
        note: Trim tank moves fuel aft in cruise for an aft CG and less drag. Leave it AUTO unless the FCOM says otherwise.
      - OXY CREW SUPPLY: "ON"
      - divider: Panels and pedestal
      - BARO REF: SET
      - FD / LS: ON / AS RQRD
      - WEATHER RADAR / PWS: OFF / AUTO
      - ATC: CODE SET — STBY
      - divider: FMGS
      - MCDU: INIT A · F-PLN · RAD NAV · INIT B · PERF
      - TAKEOFF DATA: V1 / VR / V2 · FLEX · THR RED / ACC
      - FCU: SPD / HDG / ALT SET
      - OXYGEN MASK: TEST
      - TAKEOFF BRIEFING: COMPLETED

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - COCKPIT PREP: COMPLETED (BOTH)
      - GEAR PINS & COVERS: REMOVED
      - SIGNS: ON / AUTO
      - ADIRS: NAV
      - FUEL QUANTITY: ____ KG
      - TO DATA: SET
      - BARO REF: ____ SET (BOTH)
      - divider: Below the line
      - WINDOWS / DOORS: CLOSED (BOTH)
      - BEACON: "ON"
      - THR LEVERS: IDLE
      - PARKING BRAKE: AS RQRD

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - ENG START SEL: IGN / START
      - ENG MASTER 1: "ON"
        note: Start order varies by operator (1-2-3-4 and 3-4-1-2 are both flown). Follow your add-on's own checklist; start one engine at a time on APU bleed.
      - ENG MASTER 2: "ON"
      - ENG MASTER 3: "ON"
      - ENG MASTER 4: "ON"
      - divider: After engine start
      - ENG START SEL: NORM
      - APU BLEED: "OFF"
      - ENG ANTI ICE: AS RQRD
      - APU MASTER SW: AS RQRD
      - GROUND SPOILERS: ARM
      - RUDDER TRIM: ZERO
      - FLAPS: SET
      - PITCH TRIM: SET
      - ECAM STATUS: CHECK

  - id:   astart
    name: After Start
    kind: checklist
    items:
      - ANTI ICE: AS RQRD
      - ECAM STATUS: CHECKED
      - PITCH TRIM: ____ SET
      - RUDDER TRIM: ZERO

  - id:   taxi
    name: Before Takeoff
    kind: checklist
    items:
      - FLIGHT CONTROLS: CHECKED (BOTH)
        note: Body gear steering is available on the long wheelbase — start turns late and keep the cockpit past the taxiway centreline before turning.
      - FLT INST: CHECKED (BOTH)
      - BRIEFING: CONFIRMED
      - FLAP SETTING: CONF ____ (BOTH)
      - V1, VR, V2 / FLX TEMP: ____ (BOTH)
      - ATC: SET
      - ECAM MEMO: TO NO BLUE
      - AUTO BRK: MAX
        sub: true
      - SIGNS: "ON"
        sub: true
      - CABIN: CHECK
        sub: true
      - SPLRS: ARM
        sub: true
      - FLAPS: T.O
        sub: true
      - T.O CONFIG: NORMAL
        sub: true
      - divider: Below the line
      - TAKEOFF RWY: ____ (BOTH)
      - CABIN CREW: ADVISED
      - TCAS: TA OR TA/RA
      - ENG START SEL: AS RQRD
      - PACKS: AS RQRD
        note: "Line-up flow, not on the card: exterior lights T.O, strobe ON, chrono start."

  - id:   climb
    name: After Takeoff / Climb
    kind: checklist
    items:
      - LDG GEAR: UP
      - FLAPS: RETRACTED
      - PACKS: "ON"
      - divider: Below the line
      - BARO REF: ____ SET (BOTH)
        note: Read at the transition altitude.

  - id:   cruise
    name: Cruise / Fuel Check
    kind: flow
    items:
      - FUEL ON BOARD: CHECKED vs FLIGHT PLAN
        note: "Long-haul habit: log fuel at every waypoint or every 30 min and compare with the OFP."
      - TRIM TANK: TRANSFER MONITORED
        note: Aft transfer in cruise, forward transfer back before descent — it should be complete by the approach.
      - CG: WITHIN LIMITS
      - POSITION / NAV ACCURACY: CROSSCHECKED
      - ETOPS / EDTO: AS RQRD
      - STEP CLIMB: AS PLANNED
      - DESCENT PREP: ARRIVAL · APPR · MINIMA IN MCDU

  - id:   appr
    name: Approach
    kind: checklist
    items:
      - BRIEFING: CONFIRMED
      - ECAM STATUS: CHECKED
      - SEAT BELTS: "ON"
      - BARO REF: ____ SET (BOTH)
      - MINIMUM: ____ SET (BOTH)
      - ENG START SEL: AS RQRD

  - id:   land
    name: Landing
    kind: checklist
    items:
      - CABIN CREW: ADVISED
      - A/THR: SPEED / OFF
      - AUTO BRAKE: AS RQRD
      - ECAM MEMO: LDG NO BLUE
      - LDG GEAR: DN
        sub: true
      - SIGNS: "ON"
        sub: true
      - CABIN: CHECK
        sub: true
      - SPLRS: ARM
        sub: true
      - FLAPS: SET
        sub: true

  - id:   aland
    name: After Landing
    kind: checklist
    items:
      - FLAPS: RETRACTED
      - SPOILERS: DISARMED
      - APU: START
      - RADAR: OFF / STBY
      - PWS: "OFF"

  - id:   park
    name: Parking
    kind: checklist
    items:
      - APU BLEED: "ON"
      - ENGINES: "OFF"
      - SEAT BELTS: "OFF"
      - EXT LT: AS RQRD
      - FUEL PUMPS: "OFF"
      - PARK BRK & CHOCKS: AS RQRD

  - id:   secure
    name: Securing the Aircraft
    kind: checklist
    items:
      - ADIRS: "OFF"
      - OXYGEN: "OFF"
      - APU BLEED: "OFF"
      - EMER EXIT LT: "OFF"
      - SIGNS: "OFF"
      - APU AND BAT: "OFF"
