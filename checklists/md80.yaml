# MD-80 — McDonnell Douglas MD-81 / -82 / -83 / -87 / -88
id:   md80
code: MD-80   # tab label
name: McDonnell Douglas MD-80
sub:  2 × JT8D-217 tail-mounted · two-crew · EPR thrust · slats/flaps 0/11/15/28/40
manufacturer: McDonnell Douglas
variants:
  - name: MD-81
    note: The original. JT8D-209s, lowest thrust of the family.
  - name: MD-82
    note: The common one and the usual choice of add-on developers. JT8D-217s, higher weights.
  - name: MD-83
    note: Extra fuel in the cargo bay and JT8D-219s — same flows, longer legs, heavier landings to plan for.
  - name: MD-87
    note: Short body, tall fin. Lively performance and a noticeably different sight picture on the flare.
  - name: MD-88
    note: EFIS displays and an FMS in place of the earlier PMS. The panel scan is the same, the readouts are not.

phases:
  - id:   power
    name: Power Up
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - BATTERY: "ON"
      - EXT PWR / APU: ON — BUS LIGHTS OUT
      - EMERGENCY LIGHTS: ARM
      - IRS L / R: NAV
        note: Enter present position and let them align. On the MD-88 the FMS takes position from the IRUs.
      - GALLEY POWER: "ON"
      - PARKING BRAKE: SET

  - id:   preflight
    name: Before Start
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - BRIEFING / EFB: COMPLETED / SET (B)
      - LOGBOOK & GEAR PINS: ____ ON BOARD
      - COCKPIT PREPARATIONS: COMPLETED (B)
      - PREFLIGHT INSPECTION: COMPLETED (B)
      - WINDOWS: CLOSED / LOCKED (B)
      - CIRCUIT BREAKERS: CHECKED (B)
      - OXYGEN & INTERPHONE: CHKD, ON, 100% (B)
      - SMOKE GOGGLES: CHECKED (B)
      - PRESSURIZATION: AUTO (UP) AND SET
        note: Two controllers, and the cruise altitude goes in by hand. Set it before you push, not in the climb.
      - AIR COND SHUTOFF: AUTO
      - ANTI-SKID: ARMED
      - EGPWS: TESTED
      - FD CMD, CADC, EFIS & RADIO NAV SELECTORS: NORMAL
      - EMER LIGHTS: ARMED
      - SEAT BELT & NO SMOKING SIGNS: "ON"
      - FLT GUIDANCE CONTROL PNL: CHKED & SET (B)
      - CLOCKS & ALTIMETERS: ____, ____, ____, SET (B)
      - FMS: CHECKED & SET (B)
      - ENGINE OIL QUANTITY: CHECKED
      - TAKEOFF WARNING: CHECKED
      - RUDDER POWER: POWER
      - RADAR: "OFF"
      - TRANSPONDER: STANDBY
      - RADIOS: SET (B)
      - RUDDER & AILERON TRIM: FREE & ZERO
      - PARKING BRAKES: SET, PRESSURE CHECKED
      - divider: Below the line
      - FUEL PUMPS & X FEED: ON & CLSD
      - FUEL QUANTITY: MIN ____, FOB ____ (B)
      - V SPEEDS: ____, ____, ____ SET (B)
      - STABILIZER TRIM: ____ CHECKED & SET (B)
      - PMS: CHECKED & SET
        note: JT8Ds are rated in EPR, not N1 — set the thrust rating panel and check the bugs match your takeoff numbers.

  - id:   bstart
    name: Ready for Start
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - DOCUMENTS: ON BOARD
      - CABIN: SECURE
      - COCKPIT DOOR: LOCKED
      - PNEUMATIC CROSSFEEDS: OPEN
      - HYDRAULICS: ON, HIGH & CHECKED
      - ANTI-COLLISION LIGHTS: "ON"
      - ANNUNCIATOR / DOOR LIGHTS: CHKD & LTS OUT
      - AIR COND SUPPLY SWITCHES: "OFF"
      - FUEL PUMPS: SET
      - PITOT / WINDSHIELD HEAT: CAPT / ON
      - IGNITION: "ON"
      - PNEUMATIC PRESSURE: CHECKED

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - AREA: CLEAR — CLEARANCE OBTAINED
      - PNEUMATIC PRESSURE: CHECKED
      - IGNITION: A OR B
      - ENGINE 2 START: ENGAGED
        note: No. 2 first is common so the ground crew stays clear of the left side, but operators vary — follow your add-on's checklist.
      - FUEL LEVER 2: ON AT 20% N2
        note: JT8D — light-off within about 20 s, oil pressure rising, starter out around 40% N2.
      - ENGINE 1: START
      - IGNITION: OFF
      - ENGINE PARAMETERS: STABILISED

  - id:   astart
    name: After Start
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - PNEUMATIC CROSSFEEDS: CLOSED
      - TRANSPONDER: XPDR / XPDR 1/2
      - HYDRAULICS: ON, HIGH & CHECKED
      - APU AIR SWITCH: "OFF"
      - ENGINE ANTI-ICE: ON / OFF
      - FUEL HEAT: ON / OFF
      - IGNITION: "OFF"
      - ELECTRICAL SYSTEM: CHECKED
      - AIR COND SUPPLY SWITCHES: AUTO
      - YAW DAMPER: "ON"
      - ANNUNCIATORS: CHECKED
      - SHOULDER HARNESS: ON (B)
      - GROUND EQUIPMENT: CLEAR (B)

  - id:   taxi
    name: Taxi
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - FLAPS / SLATS: ____°, ____°, ____°, TO BLUE LT (B)
        note: The MD-80's takeoff flap dials between 11 and 24 — a small setting change is worth real runway performance.
      - FLIGHT CONTROLS / ELEV AUG: CHECKED (B)
      - APU: (CAPT) ON / OFF
      - FUEL HEAT: "OFF"
      - TAKEOFF BRIEFING: COMPLETED (B)

  - id:   btakeoff
    name: Before Takeoff
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - FLAPS / SLATS: ____°, ____°, ____°, TO BLUE LT (B)
      - V SPEEDS: ____, ____, ____ RECHKD (B)
      - STAB TRIM: ____ SET (B)
      - ANNUNCIATORS: CHECKED
      - FLIGHT ATTENDANTS: SEATED
      - divider: Below the line
      - DEPARTURE RUNWAY: CONFIRMED (B)
      - IGNITION: "ON"
      - RADAR / EGPWS (TERRAIN DISPLAY): "ON"
      - TRANSPONDER: TA/RA
      - LANDING LIGHTS: "ON"
      - RUNWAY ALIGNMENT: CHECKED (B)

  - id:   atakeoff
    name: Climb (Silent)
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - FLAPS / SLATS: UP / RET
      - FLAP T.O. SEL WHEEL: STOWED
      - LANDING GEAR: HANDLE UP
      - HYDRAULIC PUMPS: OFF, LOW & OFF
      - ENGINE / AIRFOIL ANTI-ICE: ON / OFF
      - IGNITION: ON / OFF
      - APU: AS REQUIRED
      - FUEL PUMPS: SET
      - PRESSURIZATION: CHECKED
      - RUDDER TRAVEL UNRESTRICTED LIGHT: OUT
      - ART SWITCH: AUTO
      - ENGINE SYNC: ON / OFF
      - divider: At transition altitude
      - ALTIMETERS: 29.92 (B)
      - LANDING LIGHTS: "OFF"

  - id:   cruise
    name: Cruise
    kind: flow
    items:
      - FUEL: CHECKED vs FLIGHT PLAN
      - FUEL BALANCE: L / R WITHIN LIMITS
        note: Watch the wing tanks — this aeroplane will happily fly out of balance if the centre tank empties unevenly.
      - PRESSURIZATION: CHECKED
      - CRUISE EPR: SET
      - DESCENT PREP: ARRIVAL · APPROACH · MINIMUMS SET

  - id:   descent
    name: Descent
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - LANDING RUNWAY ASSESSMENT: COMPLETED
      - APPROACH BRIEFING / EFB: COMPLETED / SET (B)
      - HYD PMPS QTY & PRESS: ON, HIGH & CHCKD
      - AIR COND & PRESS: CHECKED & SET
      - ENGINE SYNC: "OFF"
      - FUEL PUMPS & CROSSFEED: SET
      - FUEL HEAT: "OFF"
      - ANTI-ICE: ON / OFF
      - WINDSHIELD ANTI-FOG: ON / OFF
      - V SPEEDS: ____ ____ SET (B)
      - EGPWS (TERR DISPLAY): ON / OFF
      - divider: At transition altitude
      - SEAT BELT SIGN: "ON"
      - ALTIMETERS: ____, ____, SET & X-CHCKD (B)
      - EXTERIOR LIGHTS: ON / OFF
      - SHOULDER HARNESSES: ON (B)

  - id:   approach
    name: Approach
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - RMI SELECTORS: SET
      - FLIGHT ATTENDANTS: NOTIFIED
      - APU: (CAPT) AS REQUIRED
      - "APPROACH FREQ'S & COURSES": SET

  - id:   land
    name: Before Landing
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - HYD PMPS, QTY & PRESS: ON, HIGH & CHCKD
      - IGNITION: "ON"
      - FLIGHT ATTENDANTS: SEATED
      - LANDING GEAR: DOWN & 3 GREEN (B)
      - SPOILERS: ARMED (B)
      - BRAKE PRESSURE: CHECKED
      - divider: Below the line
      - FLAPS / SLATS: ____°, ____°, LAND BLUE LT (B)
      - AUTOPILOT: ENGAGED / OFF

  - id:   aland
    name: After Landing (Silent)
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - REVERSE LIGHTS: OUT
      - LANDING / TAXI LIGHTS: AS REQUIRED
      - ANTI-SKID: "OFF"
      - FLAPS / SLATS: UP / RET
      - SPOILER LEVER: FWD, DETENT
      - RADAR: "OFF"
      - TRANSPONDER: XPDR XPDR 1/2
      - HYDRAULIC PRESSURE & QUANTITY: CHECKED
      - AIRFOIL ANTI-ICE: "OFF"
      - ENGINE ANTI-ICE: ON / OFF
      - PITOT / WINDSHIELD HEAT: "OFF"
      - IGNITION: "OFF"
      - APU: ON / OFF
      - divider: Single engine taxi (captain's command)
      - APU: "ON"
      - FUEL CONTROL LEVER: "OFF"

  - id:   shutdown
    name: Parking
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - PARKING BRAKES: SET
      - ELECTRICAL SWITCHES: SET
      - FUEL CONTROL LEVERS: "OFF"
      - SEAT BELT SIGN: "OFF"
      - ENGINE ANTI-ICE: "OFF"
      - ANTI-COLLISION LIGHTS: "OFF"
      - CVR C/B: AS REQUIRED
      - CHOCKS: IN PLACE
      - EXTERIOR LIGHTS: AS REQUIRED
      - FUEL PUMPS: AS REQUIRED
      - AIR COND SUPPLY SWITCHES: AS REQUIRED
      - AUX & TRANS HYDRAULIC PUMPS: "OFF"
      - TRANSPONDER: STANDBY
      - FLIGHT DIRECTORS: "OFF"

  - id:   secure
    name: Terminating (Silent)
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - AIR COND SUPPLY SWITCHES: "OFF"
      - APU AIR SWITCH: "OFF"
      - MANUAL PRESS CONTROL: CLOSED
      - RADIOS / TRANSPONDER / RADAR: "OFF"
      - PNEUMATIC CROSSFEEDS: CLOSED
      - OXYGEN VALVES AND REGULATORS: "OFF"
      - EMERGENCY LIGHTS: "OFF"
      - AC/DC METER SELECTOR SWITCH: EXT PWR
      - GALLEY POWER: "OFF"
      - APU BUS SWITCHES: "OFF"
      - APU MASTER SWITCH: "OFF"
      - FUEL PUMPS: "OFF"
      - BATTERY SWITCH: "OFF"
      - GEAR PINS / ENGINE PLUGS: AS REQUIRED
      - CABIN DOOR: CLOSED
