# De Havilland Canada Dash 8 Q400
id:   dh8d
code: Q400   # tab label
name: De Havilland Canada Dash 8 Q400
sub:  2 × PW150A · two-crew · 360 kt turboprop · flaps 5 / 10 / 15 / 35
manufacturer: De Havilland Canada
variants:
  - name: Q400
    note: The standard passenger fit and the one most simulators model.
  - name: Q400 NextGen
    note: Later cabin and systems tidy-up. Same flight deck habits, same noise-and-vibration suppression to trust.
  - name: Q400 Cargo
    note: Freighter conversions with a main deck door and a load plan instead of a cabin crew. Doors, restraint and CG are the difference.

phases:

  - id:   power
    name: Originating Before Start
    kind: checklist   # flow = from memory | checklist = read & respond
    items:
      - EXT PWR / APU VOLTAGE: ON CHECKED ____ VOLTS (C)
      - RECIRC FAN: ON (C)
      - FLIGHT DECK PREPARATION: COMPLETE (CR)
      - ANTI-SKID: ON (C)
      - CAUTION / ADV LIGHTS: CHECK (C)
      - GEAR PINS: STOWED (CR)
      - GEAR LEVER: DOWN / 3 GREEN (CR)
      - ALT GEAR DR - L/G INHIBIT SWITCH: CLOSED / NORM (C)
      - STANDBY INST: CHECK (C)
      - ED MESSAGES: CHECK (C)
      - PREFLIGHT CHECKS: COMPLETE (F)

  - id:   scan
    name: Preflight Scan
    kind: flow
    items:
      - POWER LEVERS: DISC
      - CONDITION LEVERS: START & FEATHER
      - FUEL PUMPS: "ON"
      - HYDRAULICS 1 / 2 / 3: CHECKED
      - PROPELLER SYSTEM: AUTO
      - ANTI-ICE: AS REQUIRED
        note: The airframe and props take a lot of ice protection and a lot of electrical load. Plan it before you are in it.
      - NVS / VIBRATION SUPPRESSION: AUTO
      - PRESSURISATION: LANDING ELEV SET
      - FMS: FLIGHT PLAN · PERF
      - TAKEOFF DATA: TORQUE · V-SPEEDS · TRIM SET
      - TAKEOFF BRIEFING: COMPLETED

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - CIRCUIT BREAKERS: CHECK (CR)
      - EMERGENCY LIGHTS: ARM (C)
      - ESCAPE HATCH: CLOSED (C)
      - NOSE STEERING: OFF (C)
      - SEAT BELTS & SHOULDER HARNESS: ON (CR)
      - YAW DAMPER: ON (C)
      - FUEL QTY: CHECK, ____ LBS (C)
      - "HYD #3 PRESSURE": CHECK, ____ PSI (C)
      - EMERG BRAKE / PRESSURE: ON / CHECK (C)
      - POWER LEVERS: DISC (C)
      - CONDITION LEVERS: FUEL OFF (C)
      - DEPARTURE BRIEF: COMPLETE (CR)

  - id:   start
    name: Engine Start
    kind: checklist
    items:
      - BATTERY MASTER / MAIN / AUX / STBY: ON (C)
      - DOORS / FUELING LIGHTS: CLOSED / OUT (C)
        note: "Q400 Cargo: main deck cargo door included, and the CG checked against the load plan."
      - SEAT BELT SIGN: ON (C)
      - APU BLEED: OFF (C)
      - LOCK ISOLATE: OFF (C)
      - ANTI-COLLISION LIGHT: RED (C)
      - ENGINE: CLEAR (CR)
        note: Right engine first as a habit — it runs the hydraulics and the air conditioning while the left one waits.

  - id:   astart
    name: After Start
    kind: checklist
    items:
      - EXT PWR / APU: OFF (C)
      - MAIN BUS TIE: OFF (C)
      - BLEEDS: MIN / ON (C)
      - BATTERY TEMPS: CHECK (C)
      - HYD PRESS / QTY: CHECK (C)
      - "HYD #3 & ELEVATOR": CHECK (CR)
      - AUX / PTU / STBY PUMPS: ON (C)
      - AUTOFEATHER: A/F SELECT (C)
      - ENGINE RATING: ____ % SET / CHECK (C)
      - DEICE PRESSURE: CHECK (F)
      - FLAPS: ____ ° SET / INDICATING (CR)
      - RUDDER TRAVEL: FULL TRAVEL (C)
      - NOSE STEERING: ON (C)
      - FLIGHT / TAXI: TAXI (C)
      - ICE PROTECTION: AS REQ'D (C)
      - CAUTION / WARNING LIGHTS: CHECK (C)
      - FLIGHT INSTR / YD / FD / RADIO: CHECK / ON / SET (CR)
      - ALTIMETERS: ____ SET / CROSSCHECK (CR)

  - id:   taxi
    name: Taxi
    kind: checklist
    items:
      - TAKEOFF DATA / BRIEFING: SET / COMPLETE (CR)
      - CONDITION LEVERS: MAX (CR)
      - TRIMS: 3 SET (CR)
      - T/O WARNING: TEST (C)

  - id:   btakeoff
    name: Before Takeoff
    kind: checklist
    items:
      - F/A NOTIFICATION: RECEIVED (F)
      - TRANSPONDER / TCAS: ON / ALT (F)
      - FLIGHT CONTROLS: CHECKED / FREE (F)
      - RADAR / TERRAIN: AS REQ'D (F)
      - FLIGHT / TAXI: FLIGHT (F)
      - CABIN PA: COMPLETE (F)
      - EXTERNAL LIGHTS: ON (F)
        note: It accelerates hard and gets airborne early. Hold the nose where the numbers say instead of letting it fly itself off.

  - id:   climb
    name: Climb
    kind: checklist
    items:
      - LANDING GEAR: UP (PM)
      - FLAPS: 0° (PM)
      - POWER: SET (PM)
      - BLEEDS: NORM / ON (PM)
      - AUTOFEATHER: OFF (PM)
      - AUX / PTU / STBY PUMPS: OFF NORMAL (PM)
      - ENGINE TEMPS / PRESS: CHECK (PM)
      - ICE PROTECTION: AS REQ'D (PM)
      - CABIN TEMP / PRESS: CHECK (PM)

  - id:   cruise
    name: Cruise
    kind: checklist
    items:
      - ALTIMETERS: ____ SET / CROSSCHECK (CR)
      - POWER: SET (PM)
        note: Np down to 850 in the cruise is what makes the cabin liveable. The passengers behind you can hear the difference.
      - SEAT BELTS SIGN: AS REQ'D (PM)
      - LIGHTS: AS REQ'D (PM)
      - CABIN PRESSURE: CHECK (PM)
      - 24-HR ICE PROTECTION TEST: AS REQ'D (PM)

  - id:   desc
    name: Descent
    kind: checklist
    items:
      - ALTIMETERS: ____ SET / CROSSCHECK (CR)
      - FUEL BALANCE: CHECK (PM)
      - PRESSURIZATION: SET (PM)
      - CABIN PA: COMPLETE (PM)

  - id:   appr
    name: Approach
    kind: checklist
    items:
      - ALTIMETERS: ____ SET / CROSSCHECK (CR)
      - APPROACH & LANDING BRIEF: COMPLETE (CR)
      - BUGS: SET (CR)
      - GPWS LANDING FLAP: SELECTED ____ ° (PM)
      - FUEL TRANSFER: OFF (PM)
      - HYD PRESS / QTY: CHECK (PM)
      - CAUTION / WARNING LIGHTS: CHECK (PM)
      - SEAT BELTS SIGN: ON (PM)
      - EXTERNAL LIGHTS: ON (PM)

  - id:   land
    name: Before Landing
    kind: checklist
    items:
      - BLEEDS: MIN / ON (PM)
      - AUX / PTU / STBY PUMPS: ON (PM)
      - F/A NOTIFICATION: COMPLETE (PM)
      - LANDING GEAR: DOWN / 3 GREEN (CR)
      - FLAPS: ____ ° SET / INDICATING (CR)
      - CONDITION LEVERS: MAX (CR)

  - id:   aland
    name: After Landing
    kind: checklist
    items:
      - RADAR: STBY (F)
      - TRANSPONDER / TCAS: AS REQ'D (F)
      - FLAPS: 0° (F)
      - CONTROL LOCK: ON (F)
      - TANK AUX PUMPS 1 & 2: OFF (F)
      - YAW DAMPER: OFF (F)
      - FLIGHT / TAXI: TAXI (F)
      - ANTI COLLISION LIGHTS: RED (F)
      - LIGHTS: AS REQ'D (F)
      - MAIN BUS TIE: TIE (F)
      - APU: AS REQ'D (F)

  - id:   shut
    name: Parking
    kind: checklist
    items:
      - TAXI LIGHT: OFF (C)
      - EMERG BRAKE: ON (C)
      - STBY HYD PRESS & PTU CNTRL: NORM (C)
      - POWER LEVERS: DISC (C)
      - CONDITION LEVERS: START / FEATHER (C)
      - SEAT BELTS SIGN: OFF (C)
      - RADAR: OFF (C)
      - NOSE STEERING: OFF (C)
      - TRANSPONDER: STBY (C)
      - BLEEDS: MIN / OFF (C)
      - EXT PWR / APU: AS REQ'D (C)
      - CONDITION LEVERS (30 SEC): FUEL OFF (C)
      - LIGHTS: AS REQ'D (C)
      - EMERGENCY LIGHTS: OFF (C)
      - STBY / AUX / MAIN BATTERIES: AS REQ'D (C)
      - BATTERY MASTER: AS REQ'D (C)

  - id:   secure
    name: Securing
    kind: checklist
    items:
      - RECIRC FAN: OFF (F)
      - EMERGENCY LIGHTS: OFF (F)
      - ANTI-SKID: OFF (F)
      - AIRFRAME MODE SELECT: OFF (F)
      - ENGINE INTAKE BYPASS DOORS: CLOSED (F)
      - LIGHTS: OFF (F)
      - FMS & DISPLAYS: OFF (F)
      - EXT POWER / APU: OFF (F)
      - STBY / AUX / MAIN BATTERIES: OFF (F)
      - BATTERY MASTER: OFF (F)
