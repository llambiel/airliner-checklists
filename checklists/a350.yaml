# A350 — Airbus A350-900 / -1000
id:   a350
code: A350   # tab label
name: Airbus A350 XWB
sub:  2 × Trent XWB · six wide displays · CONF 1+F / 2 / 3
manufacturer: Airbus
variants:
  - name: "-900"
    note: The standard XWB and the one most add-ons model. Four-wheel main bogies.
  - name: "-1000"
    note: 7 m longer with six-wheel main bogies and higher-thrust XWB-97s — the extra axle steers on the ground.
  - name: "-900ULR"
    note: Ultra long range, extra fuel and no cargo tank penalty. Sector planning changes, procedures do not.

phases:

  - id:   prelim
    name: Preliminary Cockpit Prep
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - ENG MASTER 1 + 2: "OFF"
      - ENG START SEL: NORM
      - WEATHER RADAR: "OFF"
      - LDG GEAR LEVER: DOWN
      - WIPERS: "OFF"
      - BAT 1 + 2 + EMER + APU: CHECK — AUTO
      - EXT PWR: AS RQRD
      - APU FIRE: TEST
      - APU: START
      - APU BLEED: "ON"
      - ADIRS 1 / 2 / 3: NAV
      - COCKPIT LIGHTS: AS RQRD
      - OIS / EFB: LOADED — PERF APP READY
      - HYD GREEN / YELLOW: CHECK
        note: Two hydraulic systems, not three — electro-hydrostatic actuators back up the surfaces the third system used to drive.
      - PARKING BRAKE: "ON"
      - BRAKE PRESS: CHECK
      - FLAPS: CHECK POSITION
      - SPEED BRAKE LEVER: RET & DISARMED
      - GEAR PINS & COVERS: ON BOARD

  - id:   prep
    name: Cockpit Preparation
    kind: flow
    items:
      - divider: Overhead panel
      - RCDR GND CTL: "ON"
      - EVAC SWITCH: CAPT & PURS
      - EXT LT: NAV & LOGO ON · STROBE AUTO
      - SIGNS: SEAT BELTS ON · NO SMOKING AUTO
      - EMER EXIT LT: ARM
      - ANTI ICE: AS RQRD
      - LDG ELEV: AUTO
      - PACK FLOW / X BLEED: AS RQRD / AUTO
      - FUEL PUMPS: "ON"
      - OXY CREW SUPPLY: "ON"
      - divider: Panels and pedestal
      - BARO REF: SET
      - FD / LS: ON / AS RQRD
      - KCCU / RMP: CHECKED
      - WEATHER RADAR / PWS: OFF / AUTO
      - ATC: CODE SET — STBY
      - divider: FMGS
      - MFD FMS: INIT · F-PLN · FUEL & LOAD · PERF
      - TAKEOFF DATA: V1 / VR / V2 · FLEX · THR RED / ACC
      - FCU: SPD / HDG / ALT SET
      - OXYGEN MASK: TEST
      - TAKEOFF BRIEFING: COMPLETED

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - COCKPIT PREP: COMPLETED (BOTH)
      - GEAR PINS & COVERS: REMOVED
      - SIGNS: ON / AUTO
      - ADIRS: NAV
      - FUEL QUANTITY: ____ KG
      - TO DATA: SET
      - BARO REF: ____ SET (BOTH)
      - divider: Below the line
      - WINDOWS / DOORS: CLOSED (BOTH)
      - BEACON: "ON"
      - THR LEVERS: IDLE
      - PARKING BRAKE: AS RQRD

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - ENG START SEL: IGN / START
      - ENG MASTER 2: "ON"
        note: Fully automatic start — the FADEC runs the whole sequence and aborts by itself if a parameter goes out of limits. Monitor, don't intervene.
      - ENG MASTER 1: "ON"
      - divider: After engine start
      - ENG START SEL: NORM
      - APU BLEED: "OFF"
      - ENG ANTI ICE: AS RQRD
      - APU MASTER SW: AS RQRD
      - GROUND SPOILERS: ARM
      - RUDDER TRIM: ZERO
      - FLAPS: SET
      - PITCH TRIM: SET
      - ECAM STATUS: CHECK

  - id:   astart
    name: After Start
    kind: checklist
    items:
      - ANTI ICE: AS RQRD
      - ECAM STATUS: CHECKED
      - PITCH TRIM: ____ SET
      - RUDDER TRIM: ZERO

  - id:   taxi
    name: Before Takeoff
    kind: checklist
    items:
      - FLIGHT CONTROLS: CHECKED (BOTH)
        note: The external camera on the fin gives you the nose gear and the wing tips — use it in tight turns rather than guessing.
      - FLT INST: CHECKED (BOTH)
      - BRIEFING: CONFIRMED
      - FLAP SETTING: CONF ____ (BOTH)
      - V1, VR, V2 / FLX TEMP: ____ (BOTH)
      - ATC: SET
      - ECAM MEMO: TO NO BLUE
      - AUTO BRK: MAX
        sub: true
      - SIGNS: "ON"
        sub: true
      - CABIN: CHECK
        sub: true
      - SPLRS: ARM
        sub: true
      - FLAPS: T.O
        sub: true
      - T.O CONFIG: NORMAL
        sub: true
      - divider: Below the line
      - TAKEOFF RWY: ____ (BOTH)
      - CABIN CREW: ADVISED
      - TCAS: TA OR TA/RA
      - ENG START SEL: AS RQRD
      - PACKS: AS RQRD
        note: "Line-up flow, not on the card: exterior lights T.O, strobe ON, chrono start."

  - id:   climb
    name: After Takeoff / Climb
    kind: checklist
    items:
      - LDG GEAR: UP
      - FLAPS: RETRACTED
      - PACKS: "ON"
      - divider: Below the line
      - BARO REF: ____ SET (BOTH)
        note: Read at the transition altitude.

  - id:   cruise
    name: Cruise / Fuel Check
    kind: flow
    items:
      - FUEL ON BOARD: CHECKED vs FLIGHT PLAN
      - FUEL BALANCE / CG: WITHIN LIMITS
      - POSITION / NAV ACCURACY: CROSSCHECKED
      - ETOPS: AS RQRD
      - STEP CLIMB: AS PLANNED
      - DESCENT PREP: ARRIVAL · APPR · MINIMA IN MCDU

  - id:   appr
    name: Approach
    kind: checklist
    items:
      - BRIEFING: CONFIRMED
      - ECAM STATUS: CHECKED
      - SEAT BELTS: "ON"
      - BARO REF: ____ SET (BOTH)
      - MINIMUM: ____ SET (BOTH)
      - ENG START SEL: AS RQRD

  - id:   land
    name: Landing
    kind: checklist
    items:
      - CABIN CREW: ADVISED
      - A/THR: SPEED / OFF
      - AUTO BRAKE: AS RQRD
      - ECAM MEMO: LDG NO BLUE
      - LDG GEAR: DN
        sub: true
      - SIGNS: "ON"
        sub: true
      - CABIN: CHECK
        sub: true
      - SPLRS: ARM
        sub: true
      - FLAPS: SET
        sub: true

  - id:   aland
    name: After Landing
    kind: checklist
    items:
      - FLAPS: RETRACTED
      - SPOILERS: DISARMED
      - APU: START
      - RADAR: OFF / STBY
      - PWS: "OFF"

  - id:   park
    name: Parking
    kind: checklist
    items:
      - APU BLEED: "ON"
      - ENGINES: "OFF"
      - SEAT BELTS: "OFF"
      - EXT LT: AS RQRD
      - FUEL PUMPS: "OFF"
      - PARK BRK & CHOCKS: AS RQRD

  - id:   secure
    name: Securing the Aircraft
    kind: checklist
    items:
      - ADIRS: "OFF"
      - OXYGEN: "OFF"
      - APU BLEED: "OFF"
      - EMER EXIT LT: "OFF"
      - SIGNS: "OFF"
      - APU AND BAT: "OFF"
