# 787 — Boeing 787-8 / -9 / -10 Dreamliner
id:   b787
code: "787"   # tab label
name: Boeing 787 Dreamliner
sub:  2 × GEnx-1B / Trent 1000 · bleedless · flaps 1/5/15/20/25/30
manufacturer: Boeing
variants:
  - name: "-8"
    note: The short one, longest range of the three.
  - name: "-9"
    note: 6 m stretch, higher weights. The most common 787 in service.
  - name: "-10"
    note: Longest fuselage, shortest range. Semi-levered gear helps the tail strike margin.

phases:

  - id:   power
    name: Power Up
    kind: flow   # flow = from memory | checklist = read & respond
    items:
      - BATTERY: "ON"
      - EXT PWR / APU: "ON"
        note: No bleed air anywhere on this aeroplane — the packs, engine start and wing anti-ice all run on electrical power from four generators.
      - EMERGENCY LIGHTS: ARMED
      - IRS: ALIGNING — NO SWITCH, AUTOMATIC ON POWER-UP
      - DISPLAYS / EFB: CONFIGURED
      - CDU: POS INIT · ROUTE · PERF INIT
      - PARKING BRAKE: SET

  - id:   scan
    name: Preflight Scan
    kind: flow
    items:
      - OXYGEN: TESTED — 100%
      - ELECTRICAL: GENERATORS ON — NO STATUS MESSAGES
      - CABIN AIR COMPRESSORS: AUTO
      - PRESSURIZATION: LAND ALT AUTO
        note: Cabin altitude tops out around 6,000 ft thanks to the composite fuselage — you will feel the difference on a long sector.
      - WING ANTI-ICE: AUTO
      - HYDRAULICS L / C / R: AUTO
      - FUEL PUMPS: "ON"
      - FUEL CONTROL SWITCHES: CUTOFF
      - SPEEDBRAKE: DOWN DETENT
      - FLAPS: UP
      - ELECTRONIC CHECKLIST: RESET
      - TAKEOFF DATA: THRUST · V-SPEEDS · STAB TRIM SET

  - id:   bstart
    name: Before Start
    kind: checklist
    items:
      - FLIGHT DECK DOOR: CLOSED AND LOCKED
      - PASSENGER SIGNS: ____
      - MCP: V2 ____ · HDG/TRK ____ · ALT ____
      - TAKEOFF SPEEDS: V1 ____ · VR ____ · V2 ____
      - CDU PREFLIGHT: COMPLETED
      - TRIM: ____ UNITS · 0 · 0
      - TAXI AND TAKEOFF BRIEFING: COMPLETED
      - BEACON: "ON"

  - id:   start
    name: Engine Start
    kind: flow
    items:
      - PUSHBACK / START CLEARANCE: OBTAINED
      - ENGINE START SELECTOR 2: START
      - FUEL CONTROL SWITCH 2: RUN
        note: Autostart — move the fuel control switch to RUN as soon as the selector is in START. Electric starter, so the start is quiet and slow — the EEC introduces fuel when it is ready.
      - ENGINE START SELECTOR 1: START
      - FUEL CONTROL SWITCH 1: RUN
      - ENGINE PARAMETERS: STABILISED

  - id:   btaxi
    name: Before Taxi
    kind: checklist
    items:
      - ANTI-ICE: ____
      - RECALL: CHECKED
      - AUTOBRAKE: RTO
      - FLIGHT CONTROLS: CHECKED
      - GROUND EQUIPMENT: CLEAR

  - id:   btakeoff
    name: Before Takeoff
    kind: checklist
    items:
      - FLAPS: ____
        note: "Line-up flow, not on the card: transponder TA/RA, strobes and landing lights on, cabin secure."

  - id:   atakeoff
    name: After Takeoff
    kind: checklist
    items:
      - LANDING GEAR: UP
      - FLAPS: UP

  - id:   cruise
    name: Cruise
    kind: flow
    items:
      - FUEL ON BOARD: CHECKED vs FLIGHT PLAN
      - FUEL BALANCE: WITHIN LIMITS
      - ETOPS: AS REQUIRED
      - STEP CLIMB: AS PLANNED
      - DESCENT PREP: ARRIVAL · APPROACH · MINIMUMS IN CDU

  - id:   descent
    name: Descent
    kind: checklist
    items:
      - RECALL: CHECKED
      - AUTOBRAKE: ____
      - LANDING DATA: VREF ____ · MINIMUMS ____
      - APPROACH BRIEFING: COMPLETED

  - id:   approach
    name: Approach
    kind: checklist
    items:
      - ALTIMETERS: ____

  - id:   landing
    name: Landing
    kind: checklist
    items:
      - SPEEDBRAKE: ARMED
      - LANDING GEAR: DOWN
      - FLAPS: ____

  - id:   shutdown
    name: Shutdown
    kind: checklist
    items:
      - HYDRAULIC PANEL: SET
      - FUEL PUMPS: "OFF"
      - FLAPS: UP
      - PARKING BRAKE: ____
      - FUEL CONTROL SWITCHES: CUTOFF
      - WEATHER RADAR: "OFF"

  - id:   secure
    name: Secure
    kind: checklist
    items:
      - EMERGENCY LIGHTS: "OFF"
      - PACKS: "OFF"
